function restaurarBackup(d){
  if (!d || !d.chaves) throw new Error('formato');
  const ks = Object.keys(d.chaves).filter(k => k === KEY || Object.values(EMBED_KEYS).includes(k));
  const quando = d.criadoEm ? new Date(d.criadoEm).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : 'data desconhecida';
  openModal(`<h3>Restaurar backup</h3><p class="muted" style="font-size:13px;margin:-8px 0 14px">Backup de ${quando} · ${ks.length} áreas</p>
    <div class="pick-list">
      <button class="pick" id="rbJ"><b>Juntar com o que já está aqui</b><small>Mantém tudo e acrescenta o que falta: treinos, pesos, hábitos, check-ins, tarefas, alimentação. Em Finanças e Bíblia, fica a versão com mais dados.</small></button>
      <button class="pick" id="rbS"><b>Substituir tudo</b><small>Apaga os dados atuais e coloca os do backup no lugar.</small></button>
    </div><div class="foot"><button class="btn btn-ghost" data-x>Cancelar</button></div>`, b => {
    b.querySelector('[data-x]').onclick = closeModal;
    const fim = msg => { closeModal(); load(); applyTheme(); toast(msg); render(); };
    b.querySelector('#rbS').onclick = () => confirmBox('Substituir todos os dados atuais pelos do backup?', 'Substituir', () => { ks.forEach(k => { try { localStorage.setItem(k, d.chaves[k]); } catch(e){} }); fim('Backup restaurado ✓'); });
    b.querySelector('#rbJ').onclick = () => {
      ks.forEach(k => { try {
        if (k === KEY) { const bb = JSON.parse(d.chaves[k]); S = juntarApp(S, bb); save(); }
        else { const cur = lsGet(k); if (!cur || d.chaves[k].length > cur.length) localStorage.setItem(k, d.chaves[k]); }
      } catch(e){} });
      fim('Backup juntado ✓');
    };
  });
}

const SUPA = { url: 'https://rsdxjptswrvslzbwngue.supabase.co', key: 'sb_publishable_45AKUWGcIYIXwMxmwiXAhA_9ZCr4K9Y' };

const SYNC_KEYS = () => [KEY, ...Object.values(EMBED_KEYS)];
function hashStr(s){ let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return s.length + ':' + h; }
function syncMeta(){ try { return JSON.parse(localStorage.getItem(SM_KEY)) || {}; } catch(e){ return {}; } }
function setSyncMeta(m){ try { localStorage.setItem(SM_KEY, JSON.stringify(m)); } catch(e){} }

// envia as áreas que mudaram desde a última sincronização
let pushing = false;
async function nuvemPush(){
  if (!sb || !nuvemUser || pushing) return;
  if (syncMeta().esperaPrimeiro) return;   // ainda não recebeu a nuvem: não envia nada (evita sobrescrever dados que já existem lá)
  const m = syncMeta(); m.ultimo ||= {}; m.sujo ||= {};
  const mudou = SYNC_KEYS().filter(k => { const v = lsGet(k); return v != null && hashStr(v) !== m.ultimo[k]; });
  if (!mudou.length) return;
  if (!navigator.onLine) return nvStatus('offline');
  pushing = true; nvStatus('salvando');
  try {
    const rows = mudou.map(k => { const v = lsGet(k); m.sujo[k] ||= new Date().toISOString(); return {user_id:nuvemUser.id, chave:k, valor:v, atualizado:new Date().toISOString(), _h:hashStr(v)}; });
    setSyncMeta(m);
    const { error } = await sb.from('estado').upsert(rows.map(({_h, ...r}) => r), {onConflict:'user_id,chave'});
    if (error) throw error;
    const m2 = syncMeta(); m2.ultimo ||= {}; m2.sujo ||= {};
    rows.forEach(r => { m2.ultimo[r.chave] = r._h; if (hashStr(lsGet(r.chave) || '') === r._h) delete m2.sujo[r.chave]; });   // mudou durante o envio: continua pendente
    m2.puxado = new Date().toISOString(); setSyncMeta(m2); nvStatus('ok');
  } catch(e){ nvStatus(navigator.onLine ? 'erro' : 'offline', e.message); }
  pushing = false;
}
// traz da nuvem o que outro aparelho mudou
async function nuvemPull(primeira){
  if (!sb || !nuvemUser) return false;
  if (!navigator.onLine) { nvStatus('offline'); return false; }
  try {
    const { data, error } = await sb.from('estado').select('chave,valor,atualizado');
    if (error) throw error;
    const m = syncMeta(); m.ultimo ||= {}; m.sujo ||= {};
    delete m.esperaPrimeiro;
    let mudouApp = false, mudouEmbed = false;
    (data || []).forEach(r => {
      if (!SYNC_KEYS().includes(r.chave)) return;
      const local = lsGet(r.chave);
      if (local === r.valor) { m.ultimo[r.chave] = hashStr(r.valor); return; }
      const localMexido = local != null && m.ultimo[r.chave] != null && hashStr(local) !== m.ultimo[r.chave];
      // este aparelho mudou algo que ainda não foi para a nuvem (ex.: o iPhone fechou o app antes de enviar):
      // a mudança daqui fica, a não ser que a nuvem tenha algo feito DEPOIS dela em outro aparelho
      if (localMexido) {
        if (!m.sujo[r.chave]) m.sujo[r.chave] = new Date().toISOString();
        if (new Date(m.sujo[r.chave]) >= new Date(r.atualizado)) return;
      }
      try { localStorage.setItem(r.chave, r.valor); } catch(e){ return; }
      m.ultimo[r.chave] = hashStr(r.valor); delete m.sujo[r.chave];
      if (r.chave === KEY) mudouApp = true; else mudouEmbed = true;
    });
    setSyncMeta(m); nvStatus('ok');
    if (appIniciado && (mudouApp || mudouEmbed)) {
      if (mudouApp) { load(); applyTheme(); }
      Object.keys(embedCache || {}).forEach(k => delete embedCache[k]);
      redesenharQuandoPuder();
    }
    return mudouApp || mudouEmbed;
  } catch(e){ nvStatus(navigator.onLine ? 'erro' : 'offline', e.message); return false; }
}
// redesenha a tela depois de receber dados da nuvem, sem atrapalhar quem está digitando
function redesenharQuandoPuder(){
  const editando = () => document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  const tenta = () => { if (editando() || !$('#modal').classList.contains('hidden')) return false; render(); return true; };
  if (tenta()) return;
  const h = () => setTimeout(() => { if (tenta()) { document.removeEventListener('focusout', h); document.removeEventListener('click', h); } }, 50);
  document.addEventListener('focusout', h); document.addEventListener('click', h);
}
// chamado a cada save(): marca na hora que há mudança local e envia logo
let pushT = null;
function nuvemSujo(k){
  const m = syncMeta(); m.sujo ||= {}; m.sujo[k] = new Date().toISOString(); setSyncMeta(m);
  clearTimeout(pushT); pushT = setTimeout(nuvemPush, 1200);

function nuvemLoop(){
  // detecta mudanças (inclusive as feitas dentro de Finanças e Bíblia) e envia
  setInterval(() => {
    const m = syncMeta(); m.ultimo ||= {}; m.sujo ||= {}; let marcou = false;
    SYNC_KEYS().forEach(k => { const v = lsGet(k); if (v != null && hashStr(v) !== m.ultimo[k] && !m.sujo[k]) { m.sujo[k] = new Date().toISOString(); marcou = true; } });
    if (marcou) setSyncMeta(m);
    nuvemPush();
  }, 3000);
  setInterval(() => { if (!document.hidden) nuvemPull(false); }, 45000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) nuvemPull(false); else nuvemPush(); });
  window.addEventListener('online', () => { nuvemPush(); nuvemPull(false); });

}

  }
  a.alongamentos = byId(a.alongamentos, b.alongamentos);
  if (b.dieta) { a.dieta ||= b.dieta; a.dieta.dias ||= {}; Object.entries(b.dieta.dias || {}).forEach(([d, v]) => { const x = a.dieta.dias[d]; if (!x || (!Object.keys(x.ref||{}).length && x.prot == null && !x.livres)) a.dieta.dias[d] = v; }); }
  if (b.doente) { a.doente ||= {}; Object.entries(b.doente).forEach(([d, v]) => { if (!a.doente[d]) a.doente[d] = v; }); }
  if (b.dieta && b.dieta.fora && a.dieta) { a.dieta.fora ||= {}; Object.entries(b.dieta.fora).forEach(([d, v]) => { if (!a.dieta.fora[d]) a.dieta.fora[d] = v; }); }
  if (b.pomodoro) { a.pomodoro ||= b.pomodoro; a.pomodoro.tags = byId(a.pomodoro.tags, b.pomodoro.tags); a.pomodoro.sessoes = byId(a.pomodoro.sessoes, b.pomodoro.sessoes); if (!a.pomodoro.cfg.tag && b.pomodoro.cfg) a.pomodoro.cfg.tag = b.pomodoro.cfg.tag; }
  a.mig = Object.assign({}, b.mig || {}, a.mig || {});
  return a;
}

// conta nova: pergunta o nome e o que a pessoa vai usar
function boasVindas(){
  openModal(`<h3>Bem-vindo! 👋</h3><p class="muted" style="font-size:13px;line-height:1.6;margin:-6px 0 14px">Vamos deixar o app do seu jeito. Dá para mudar tudo depois em Ajustes.</p>
    <div class="field"><label>Como você se chama?</label><input id="bvNome" placeholder="Seu nome" autocomplete="given-name"></div>
    <div class="sec-label" style="margin-top:6px">O que você vai usar?</div>
    <div class="mod-grid">${MODULOS.map(([id,t]) => `<label class="mod-op"><input type="checkbox" data-bv="${id}" ${id==='financas'?'checked':''}> ${t}</label>`).join('')}</div>
    <div class="foot"><button class="btn btn-dark" id="bvOk">Começar</button></div>`, b => {
    const fora = $('#modal').onclick; $('#modal').onclick = null;   // não fecha clicando fora
    b.querySelector('#bvOk').onclick = () => {
      const nome = b.querySelector('#bvNome').value.trim(); if (!nome) return toast('Diga seu nome');
      const sel = [...b.querySelectorAll('[data-bv]')].filter(x => x.checked).map(x => x.dataset.bv);
      if (!sel.length) return toast('Escolha pelo menos uma parte');
      S.config.nome = nome; S.config.modulos = sel.length === MODULOS.length ? undefined : [...sel, ...(sel.length > 1 ? ['inicio'] : [])];
      delete S.config.boasVindas; save();
      $('#modal').onclick = fora; closeModal(); buildNav(); navTo(homeRoute()); toast('Tudo pronto, ' + nome.split(' ')[0] + '!');
    };
  });
}
function iniciarApp(){
load();
buildNav();
applyTheme();
if (NUVEM) { const sn = $('.side-note'); if (sn) sn.innerHTML = '<span class="nv-status"></span>'; }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
$('#themeBtn').onclick = toggleTheme; $('#themeBtnM').onclick = toggleTheme;
$('#menuBtn').onclick = () => $('#app').classList.toggle('menu-open');
$('#scrim').onclick = () => $('#app').classList.remove('menu-open');
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeMenu(); }
  // barra de espaço inicia/pausa o pomodoro (ou o alongamento)
  if (e.code === 'Space' && route === 'alongamento' && AL && !e.target.closest('input,textarea,select,button') && $('#modal').classList.contains('hidden')) { e.preventDefault(); $('#alPlay') && $('#alPlay').click(); }
  // (fora de campos de texto e de janelas abertas)
  if (e.code === 'Space' && route === 'pomodoro' && !e.target.closest('input,textarea,select,button') && $('#modal').classList.contains('hidden')) {
    e.preventDefault(); const r = P().run; (r && r.rodando) ? pomoPause() : pomoStart();
  }
});
setInterval(() => { pomoTick(false); treinoTick(); alongTick(); }, 250);
// ao voltar para a aba do navegador, atualiza na hora
document.addEventListener('visibilitychange', () => { if (!document.hidden) pomoTick(route === 'pomodoro'); });
document.querySelector('.side-foot [data-route]').onclick = () => navTo('ajustes');
window.addEventListener('hashchange', go);
// volta para o dia certo se o app ficar aberto de um dia para o outro
var lastDay = todayISO();
setInterval(() => { if (todayISO() !== lastDay) { lastDay = todayISO(); ciDate = null; if (route === 'inicio' || route === 'habitos') render(); } }, 60000);
if (S.config.boasVindas) { $('#main').innerHTML = ''; $('#nav').innerHTML = ''; boasVindas(); } else go();
}
if (NUVEM) nuvemIniciar(); else iniciarApp();

</script>
