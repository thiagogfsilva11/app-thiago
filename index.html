<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f4">
<title>App Thiago</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thiago">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2314161a'/%3E%3Cpath d='M19 18h26v8H36.5v22h-9V26H19z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f4; --card:#ffffff; --ink:#14161a; --ink2:#3b3f47; --muted:#878b94; --faint:#b9bcc3;
  --line:#ebebe8; --line2:#f2f2ef; --soft:#f3f3f0; --hover:#efefec;
  --accent:#14161a; --accent-ink:#ffffff;
  --done:#14161a; --dot:#e9e9e5;
  --green:#2f8a5b; --green-soft:#e6f3ec; --red:#c4473f; --red-soft:#fbeae8;
  --amber:#c27a1e; --amber-soft:#fdf2e2; --blue:#3b6fb6; --blue-soft:#e8f0fa;
  --shadow:0 1px 2px rgba(16,18,22,.04),0 2px 8px rgba(16,18,22,.04);
  --shadow-lg:0 12px 40px rgba(16,18,22,.14);
  --r:16px; --side:244px;
}
:root[data-theme="dark"]{
  --bg:#0f1012; --card:#17181b; --ink:#f1f1ee; --ink2:#c9cac6; --muted:#8a8c92; --faint:#55585f;
  --line:#25272b; --line2:#1f2124; --soft:#1d1f22; --hover:#222428;
  --accent:#f1f1ee; --accent-ink:#111214;
  --done:#f1f1ee; --dot:#26282c;
  --green:#52b483; --green-soft:#16271e; --red:#e2706a; --red-soft:#2c1817;
  --amber:#e1a04a; --amber-soft:#2b2214; --blue:#78a4e0; --blue-soft:#18222f;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{border-color:var(--ink2);box-shadow:0 0 0 3px var(--line2)}
textarea{resize:vertical;line-height:1.6}
svg{display:block}
.hidden{display:none!important}

/* ===== LAYOUT ===== */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;z-index:40}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.4px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px;font-weight:800}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--soft)}
.icon-btn:hover{color:var(--ink);background:var(--hover)}
.icon-btn svg{width:17px;height:17px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:11px;color:var(--ink2);font-size:14px;font-weight:500;text-align:left;transition:background .12s,color .12s}
.nav-item .ic svg{width:18px;height:18px}
.nav-item:hover{background:var(--soft);color:var(--ink)}
.nav-item.active{background:var(--accent);color:var(--accent-ink)}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-note{font-size:11px;color:var(--muted);padding:2px 12px;line-height:1.5}
.content{min-width:0;display:flex;flex-direction:column}
.mtop{display:none}
.main{flex:1;min-width:0}
.page{max-width:980px;margin:0 auto;padding:44px 32px 80px}
.page.narrow{max-width:760px}
.page.wide{max-width:1180px}
.page.full{max-width:none;padding:0}
.scrim{display:none}

@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;height:100%;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow-lg)}
  .app.menu-open .side{transform:none}
  .app.menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;background:var(--bg);padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
  .mtop-title{flex:1;font-weight:700;font-size:16px}
  .page{padding:22px 16px 70px}
  #themeBtn{display:none}
  .mbar{flex-wrap:wrap;justify-content:center}
  .mbar .mname{min-width:140px;font-size:18px}
  .mbar > .btn, .newhab{width:100%;justify-content:center}
  .newhab input{flex:1;width:auto}
  .hgrid-card{padding:10px 10px 6px 0}
  .hgrid .hd.first,.hname{padding-left:12px}
  .tb td.n{white-space:normal}
  .tb td,.tb th{padding:10px 8px}
}

/* ===== HEADINGS ===== */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.ph h1{font-size:38px;font-weight:800;letter-spacing:-1.4px;line-height:1.05}
.ph .sub{color:var(--muted);font-size:13.5px;margin-top:6px}
.ph.center{flex-direction:column;align-items:center;text-align:center}
@media(max-width:860px){.ph h1{font-size:30px}}
.sec-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:30px 2px 12px}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;font-weight:600;font-size:13.5px;transition:opacity .12s,background .12s,border-color .12s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-dark{background:var(--accent);color:var(--accent-ink)}
.btn-dark:hover{opacity:.88}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.btn-ghost:hover{border-color:var(--ink2);color:var(--ink)}
.btn-danger{background:var(--card);border:1px solid var(--line);color:var(--red)}
.btn-danger:hover{border-color:var(--red);background:var(--red-soft)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px;box-shadow:var(--shadow)}
.seg button{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:11px;font-size:13px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line)}
.chip .n{font-size:11px;background:var(--soft);color:var(--muted);border-radius:20px;padding:1px 7px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.on .n{background:rgba(255,255,255,.18);color:inherit}
:root[data-theme="dark"] .chip.on .n{background:rgba(0,0,0,.12)}

/* ===== CARDS ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:22px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.stat{padding:16px 18px}
.stat .k{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.6px;margin-top:6px;line-height:1.1}
.stat .v small{font-size:12px;font-weight:500;color:var(--faint);letter-spacing:0;margin-left:3px}
.stat.clk{cursor:pointer;transition:transform .12s,border-color .12s}
.stat.clk:hover{transform:translateY(-2px);border-color:var(--ink2)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.green{color:var(--green)} .red{color:var(--red)} .amber{color:var(--amber)}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:13.5px}
.empty .big{font-size:28px;margin-bottom:8px}

/* ===== HOME ===== */
.hello h1{font-size:46px;font-weight:800;letter-spacing:-1.8px;line-height:1.05}
.hello h1 span{color:var(--faint)}
.hello .sub{color:var(--muted);margin-top:8px;font-size:15px}
@media(max-width:860px){.hello h1{font-size:34px}}
.streak{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:var(--r);background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 22%,transparent);margin:26px 0 8px}
.streak .fl{width:40px;height:40px;border-radius:11px;background:color-mix(in srgb,var(--amber) 16%,transparent);display:grid;place-items:center;color:var(--amber)}
.streak .fl svg{width:20px;height:20px}
.streak b{font-size:19px;color:var(--amber);letter-spacing:-.4px;display:block}
.streak small{font-size:12px;color:var(--muted)}
.today-habits{display:flex;flex-direction:column}
.th-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.th-row:last-child{border-bottom:none}
.th-row:hover{background:var(--soft)}
.th-row .nm{flex:1;font-weight:500}
.th-row.done .nm{color:var(--muted);text-decoration:line-through}
.quote{padding:26px 28px;display:flex;flex-direction:column;justify-content:center}
.quote q{font-size:20px;font-weight:700;font-style:italic;letter-spacing:-.4px;line-height:1.35;quotes:"\201C" "\201D"}
.quote .who{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.bigstat{padding:26px 28px;display:flex;flex-direction:column;justify-content:center}
.bigstat .k{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.bigstat .v{font-size:50px;font-weight:800;letter-spacing:-2px;line-height:1.1}
.bigstat .v small{font-size:18px;color:var(--faint);font-weight:600;letter-spacing:.06em;margin-left:6px}

/* ===== CHECKBOX SQUARE ===== */
.ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex-shrink:0;transition:background .1s,border-color .1s}
.ck svg{width:13px;height:13px;color:var(--accent-ink);opacity:0}
.ck.on{background:var(--done);border-color:var(--done)}
.ck.on svg{opacity:1}
.ck.round{border-radius:50%}

/* ===== YEAR DOTS ===== */
.yr-wrap{overflow-x:auto;padding:4px 2px 6px}
.yr{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:4px;width:max-content}
.yr i{width:11px;height:11px;border-radius:50%;background:var(--dot);display:block}
.yr i.l1{background:color-mix(in srgb,var(--done) 30%,var(--dot))}
.yr i.l2{background:color-mix(in srgb,var(--done) 55%,var(--dot))}
.yr i.l3{background:color-mix(in srgb,var(--done) 78%,var(--dot))}
.yr i.l4{background:var(--done)}
.yr i.fut{opacity:.45}
.yr i.today{outline:2px solid var(--amber);outline-offset:1px}
.yr-months{display:grid;grid-auto-flow:column;gap:4px;width:max-content;margin-top:8px;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.yr-months span{width:11px;white-space:nowrap;overflow:visible}

/* ===== HABITS GRID ===== */
.mbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin-bottom:14px}
.mbar .mname{font-size:20px;font-weight:700;letter-spacing:-.4px;min-width:180px;text-align:center}
.mnav{display:flex;align-items:center;gap:8px}
.newhab{display:flex;gap:8px;align-items:center}
.newhab input{width:220px}
.hgrid-card{padding:14px 18px 10px 0;overflow-x:auto}
.hgrid .hd.first,.hname{padding-left:18px}
.hgrid{display:grid;align-items:center;min-width:max-content}
.hgrid .hd{font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;padding:8px 0;height:34px;display:flex;align-items:center;justify-content:center}
.hgrid .hd.first{justify-content:flex-start;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding-left:8px;position:sticky;left:0;background:var(--card);z-index:3;border-right:1px solid var(--line)}
.hgrid .hd.today{color:var(--ink);font-weight:800}
.hgrid .col-today{background:var(--soft)}
.hname{display:flex;align-items:center;gap:6px;padding:9px 6px 9px 8px;border-right:1px solid var(--line);height:58px;position:sticky;left:0;background:var(--card);z-index:2}
.hname .t{flex:1;min-width:0}
.hname .t b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.hname .t small{font-size:11px;color:var(--faint)}
.hname .more{width:24px;height:24px;border-radius:7px;color:var(--faint);display:grid;place-items:center}
.hname .more:hover{background:var(--soft);color:var(--ink)}
.hname .more svg{width:15px;height:15px}
.hcell{height:58px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line2)}
.hname{border-bottom:1px solid var(--line2)}
.hcell button.ck{width:20px;height:20px;border-radius:6px}
.hcell button.ck.fut{opacity:.35;cursor:not-allowed}
.hcell button.ck:not(.fut):hover{border-color:var(--ink2)}
.menu-pop{position:fixed;z-index:120;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:170px}
.menu-pop button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;text-align:left}
.menu-pop button svg{width:15px;height:15px}
.menu-pop button:hover{background:var(--soft)}
.menu-pop button.danger{color:var(--red)}
.wk-card{padding:20px 22px 16px}
.wk-card h4{font-size:14px;font-weight:700;margin-bottom:14px}
.wk-bars{display:flex;align-items:flex-end;gap:6px;height:120px;border-bottom:1px solid var(--line);padding-bottom:2px}
.wk-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.wk-bar span{font-size:10px;font-weight:700;color:var(--ink2)}
.wk-bar i{display:block;width:100%;max-width:46px;background:var(--done);border-radius:5px 5px 2px 2px;min-height:3px}
.wk-bar i.zero{background:var(--line);height:3px}
.wk-lbl{display:flex;gap:6px;margin-top:6px}
.wk-lbl span{flex:1;text-align:center;font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap}
.wk-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line2);margin-top:14px;padding-top:12px;text-align:center}
.wk-stats b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px}
.wk-stats small{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.yr-card{padding:20px 22px}
.yr-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.yr-card .top b{font-size:16px;font-weight:700}
.yr-card .top small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.yr-card .num{text-align:right}
.yr-card .num b{font-size:22px;font-weight:800}

/* ===== CHECK-IN ===== */
.ci-date{display:flex;justify-content:center;margin:-10px 0 26px}
.ci-date input{width:auto;font-weight:600;box-shadow:var(--shadow);padding:9px 14px}
.ci-q{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:10px}
.ci-q .qi{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--ink2)}
.ci-q .qi svg{width:17px;height:17px}
.ci-q .qt{flex:1;font-weight:500}
.yn{display:flex;gap:6px}
.yn button{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--line);color:var(--muted);background:var(--card);display:flex;align-items:center;gap:6px}
.yn button svg{width:14px;height:14px}
.yn button.yes.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.yn button.no.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.yn button.mid.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.yn button:not(.on):hover{border-color:var(--faint);color:var(--ink2)}
.pill.m{background:var(--amber-soft);color:var(--amber)}
@media(max-width:620px){
  .ci-q{flex-wrap:wrap}
  .ci-q .yn{width:100%;display:grid;grid-template-columns:1fr 1.4fr 1fr}
  .ci-q .yn button{justify-content:center;padding:10px 6px}
}

/* ===== POMODORO ===== */
.nav-badge{margin-left:auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:20px;background:var(--red-soft);color:var(--red)}
.nav-badge:empty{display:none}
.nav-badge.pausa{background:var(--green-soft);color:var(--green)}
.nav-badge.parado{background:var(--soft);color:var(--muted)}
.nav-item.active .nav-badge{background:rgba(255,255,255,.18);color:inherit}
:root[data-theme="dark"] .nav-item.active .nav-badge{background:rgba(0,0,0,.12)}
.pomo{text-align:center;padding:10px 0 0}
.p-fase{font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--faint)}
.pomo.foco .p-fase{color:var(--red)}
.pomo.pausa .p-fase{color:var(--green)}
.pomo.paused .p-fase{color:var(--amber)}
.p-time{font-size:clamp(84px,17vw,150px);font-weight:800;letter-spacing:-6px;line-height:1;font-variant-numeric:tabular-nums;margin:10px 0 18px}
.pomo.paused .p-time{color:var(--muted)}
.p-bar{height:5px;border-radius:5px;background:var(--line);max-width:420px;margin:0 auto;overflow:hidden}
.p-bar i{display:block;height:100%;background:var(--ink);border-radius:5px;transition:width .25s linear}
.pomo.foco .p-bar i{background:var(--red)}
.pomo.pausa .p-bar i{background:var(--green)}
.p-tag{display:inline-flex;align-items:center;gap:7px;margin-top:16px;font-size:13px;font-weight:600;color:var(--ink2)}
.p-tag svg{width:15px;height:15px;color:var(--muted)}
.p-ctrl{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:22px}
.p-main{width:80px;height:80px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 30px rgba(16,18,22,.22);transition:transform .12s}
.p-main:hover{transform:scale(1.04)}
.p-main svg{width:30px;height:30px}
.p-main.is-play svg{fill:currentColor;margin-left:4px}
@media(hover:none){.p-hint{display:none}}
.p-side{width:46px;height:46px;border-radius:50%}
.p-side:disabled{opacity:.35;cursor:not-allowed}
.p-lbl{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.tagchip{cursor:pointer;padding-right:8px}
.tg-ed{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:inherit;opacity:.45}
.tg-ed:hover{opacity:1;background:rgba(127,127,127,.15)}
.tg-ed svg{width:12px;height:12px}
.p-sl{margin-top:22px}
.p-slh{display:flex;justify-content:space-between;align-items:baseline}
.p-slh .p-lbl{margin:0}
.p-slh b{font-size:17px;font-weight:800}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;background:var(--line);border:none;padding:0;margin-top:12px;box-shadow:none}
input[type=range]:focus{box-shadow:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--card)}
.tp-row{margin-bottom:14px}
.tp-row:last-child{margin-bottom:0}
.tp-h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.tp-h span{color:var(--muted);font-weight:600}
.ph-day{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px}
.ph-day span{letter-spacing:0;text-transform:none;font-weight:500}
.ph-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.ph-row > div:first-child{flex:1}
.ph-row b{display:block;font-weight:600;font-size:13.5px}
.ph-row small{color:var(--muted);font-size:11.5px}
.ph-min{text-align:right}
.ph-min b{font-size:17px;font-weight:800;line-height:1}
.ph-min small{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.ci-diary textarea{border:none;min-height:150px;padding:20px 22px;font-size:15px;background:transparent;box-shadow:none}
.ci-done{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--green);font-weight:600;font-size:13px;margin-top:12px}
.ci-done svg{width:16px;height:16px}
.hist-row{display:flex;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.hist-row:hover{background:var(--soft)}
.hist-row:last-child{border-bottom:none}
.hist-row .d{width:48px;text-align:center;flex-shrink:0}
.hist-row .d b{display:block;font-size:20px;font-weight:800;line-height:1}
.hist-row .d small{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:600}
.hist-row .ans{display:flex;gap:5px;margin-bottom:5px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--muted)}
.pill.y{background:var(--green-soft);color:var(--green)}
.pill.n{background:var(--red-soft);color:var(--red)}
.hist-row p{font-size:13px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===== TASKS ===== */
.task{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:9px;position:relative;overflow:hidden;cursor:pointer;transition:border-color .12s}
.task:hover{border-color:var(--faint)}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc,var(--line))}
.task .circ{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex-shrink:0;background:var(--card)}
.task .circ svg{width:12px;height:12px;opacity:0;color:var(--accent-ink)}
.task .circ:hover{border-color:var(--ink)}
.task.done .circ{background:var(--done);border-color:var(--done)}
.task.done .circ svg{opacity:1}
.task.doing .circ{border-color:var(--blue);border-width:2px;border-style:dashed}
.task .tt{flex:1;min-width:0}
.task .tt b{display:block;font-weight:600;font-size:14px}
.task .meta{display:flex;align-items:center;gap:10px;margin-top:3px;font-size:11px;color:var(--faint);flex-wrap:wrap}
.task .meta .pr{font-weight:800;letter-spacing:.06em;color:var(--pc)}
.task .meta span{display:inline-flex;align-items:center;gap:4px}
.task .meta svg{width:12px;height:12px}
.task.done{opacity:.5}
.task.done .tt b{text-decoration:line-through;font-weight:500}
.stbadge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--blue-soft);color:var(--blue);letter-spacing:.03em}
.task-add{display:flex;gap:8px;margin-bottom:16px}

/* ===== TREINO ===== */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{padding:12px 8px;text-align:center;border-radius:13px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:border-color .12s}
.wd:hover{border-color:var(--faint)}
.wd small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.wd b{display:block;font-size:17px;font-weight:800;margin:4px 0 2px}
.wd .st{font-size:10.5px;color:var(--faint);font-weight:600}
.wd.today{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.wd.sel{background:var(--soft)}
.wd.ok .st{color:var(--green)}
.wd.off b{color:var(--faint)}
@media(max-width:620px){.week{gap:5px}.wd{padding:10px 2px}.wd b{font-size:14px}}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.tb td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:top}
.tb tr:last-child td{border-bottom:none}
.tb td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tb .ex{font-weight:600}
.tb small{color:var(--muted)}
.tb-wrap{overflow-x:auto}
.goal-bar{height:6px;border-radius:6px;background:var(--line2);overflow:hidden;margin-top:6px;min-width:90px}
.goal-bar i{display:block;height:100%;background:var(--done);border-radius:6px}
.sess{border-bottom:1px solid var(--line2);padding:12px 4px}
.sess:last-child{border-bottom:none}
.sess-h{display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.sess-h b{font-weight:600}
.sess-h small{color:var(--muted);font-size:12px}
.sess-b{margin-top:10px;font-size:12.5px;color:var(--ink2);display:grid;gap:4px}
.sess-b .ln{display:flex;justify-content:space-between;gap:10px;padding:4px 8px;background:var(--soft);border-radius:7px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .12s,background .12s}
.drop:hover,.drop.over{border-color:var(--ink2);background:var(--soft);color:var(--ink)}
.drop svg{width:26px;height:26px;margin:0 auto 8px}
.chart svg{width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:10px;font-family:inherit}
.steps{counter-reset:s;display:grid;gap:8px;margin-top:10px}
.steps li{list-style:none;counter-increment:s;display:flex;gap:10px;font-size:13px;color:var(--ink2)}
.steps li::before{content:counter(s);width:20px;height:20px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}

/* ===== EMBEDS ===== */
.embed-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.embed-top h2{font-size:18px;font-weight:800;letter-spacing:-.4px}
.embed-frame{display:block;width:100%;border:0;height:calc(100vh - 69px);background:#fff}
.embed-frame.nobar{height:100vh}
@media(max-width:860px){
  .embed-top{top:57px;padding:12px 14px}
  .embed-frame{height:calc(100vh - 57px - 61px)}
  .embed-frame.nobar{height:calc(100vh - 57px)}
}

/* ===== SETTINGS ===== */
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.set-row:last-child{border-bottom:none}
.set-row .lbl{flex:1}
.set-row .lbl b{display:block;font-weight:600}
.set-row .lbl small{color:var(--muted);font-size:12.5px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.q-edit{display:grid;grid-template-columns:1fr 34px;gap:8px;margin-bottom:8px}

/* ===== MODAL / TOAST ===== */
.modal-wrap{position:fixed;inset:0;background:rgba(10,11,13,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:480px;max-height:88vh;overflow:auto;padding:24px;border:1px solid var(--line)}
.modal h3{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-bottom:16px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal .foot .sp{flex:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--accent);color:var(--accent-ink);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:200;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ===== TREINO v2 ===== */
.nav-badge.tr{background:var(--blue-soft);color:var(--blue)}
.tr-next{position:relative}
.tr-next.live{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.tr-k{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tr-title{font-size:28px;font-weight:800;letter-spacing:-.8px;margin:4px 0 2px}
.tr-alert{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 25%,transparent);font-size:13px;line-height:1.55;color:var(--ink2)}
.seq{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line2)}
.seq-chip{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;background:var(--soft);color:var(--muted)}
.seq-chip.on{background:var(--accent);color:var(--accent-ink)}
.seq-chip.ad{background:var(--green-soft);color:var(--green)}
.tr-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.tr-h b{font-size:15px}
.tr-h .muted{font-size:12px}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk7d{text-align:center;padding:8px 2px;border-radius:11px;background:var(--soft)}
.wk7d small{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wk7d b{display:block;font-size:15px;font-weight:800;margin:2px 0 4px}
.wk7d.hoje{box-shadow:0 0 0 1.5px var(--ink) inset;background:var(--card)}
.wk7i{display:flex;justify-content:center;gap:3px;flex-wrap:wrap;min-height:16px;font-size:12px;line-height:1}
.wk7i i.tr{width:9px;height:9px;border-radius:50%;background:var(--done);display:inline-block;margin-top:3px}
.pr-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--amber-soft);color:var(--amber);vertical-align:1px}
.pr-box{padding:12px 14px;border-radius:12px;background:var(--amber-soft);color:var(--ink2);font-size:13px;line-height:1.6;margin-bottom:14px}
.rot-card .tr-h{margin-bottom:8px}
.rot-list{display:grid;gap:2px;font-size:13px}
.rot-list div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line2)}
.rot-list div:last-child{border-bottom:none}
.rot-list .muted{font-size:12px;white-space:nowrap}
.sess{cursor:pointer}
.sess:hover b{text-decoration:underline}
.pick-list{display:grid;gap:6px}
.pick{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--card)}
.pick:hover{border-color:var(--ink2)}
.pick.cur{border-color:var(--blue);background:var(--blue-soft)}
.pick b{font-weight:600;font-size:13.5px}
.pick small{font-size:11.5px;color:var(--muted)}
.pick-g{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 2px 2px}
.rm-row{display:grid;grid-template-columns:1fr 46px 30px 30px 30px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2)}
.rm-row .rm-n{font-size:13px;font-weight:600;min-width:0}
.rm-row .rm-n small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.rm-row input{padding:7px 4px;text-align:center}
.rm-row .icon-btn{width:30px;height:30px;background:none}
.rm-row .icon-btn:disabled{opacity:.25}
.rm-row .icon-btn svg{width:15px;height:15px}

/* sessão ao vivo */
.tr-live{padding-bottom:120px}
.live-top{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 12px;margin-bottom:6px}
.live-top b{display:block;font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-top small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
@media(max-width:860px){.live-top{top:calc(57px + env(safe-area-inset-top, 0px))}}
.ex-card{padding:16px 14px 12px;margin-bottom:12px}
.ex-h{display:flex;align-items:center;gap:8px}
.ex-name{flex:1;text-align:left;font-size:15.5px;font-weight:700;color:var(--blue);letter-spacing:-.2px}
.ex-sub{font-size:11.5px;color:var(--muted);margin:2px 0 8px}
.ex-sug{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--green);background:var(--green-soft);padding:7px 10px;border-radius:9px;margin-bottom:8px}
.ex-sug svg{width:14px;height:14px}
.set-head,.set-row2{display:grid;grid-template-columns:34px minmax(64px,1fr) 64px 56px 52px 40px;gap:6px;align-items:center}
.set-head{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:4px 2px}
.set-head span:nth-child(n+3),.set-head span:first-child{text-align:center}
.set-row2{padding:4px 2px;border-radius:10px;transition:background .12s}
.set-row2.ok{background:var(--green-soft)}
.set-n{width:30px;height:30px;border-radius:8px;background:var(--soft);font-weight:800;font-size:13px}
.set-row2.warm .set-n{background:var(--amber-soft);color:var(--amber)}
.set-prev{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-in{padding:8px 4px;text-align:center;font-weight:700;font-size:15px;background:var(--soft);border-color:transparent}
.set-in::placeholder{font-weight:500;color:var(--faint);font-size:12.5px}
.set-row2.ok .set-in{background:transparent}
.set-rir{padding:8px 2px;font-size:12px;text-align:center;background:var(--soft);border-color:transparent;-webkit-appearance:none;appearance:none;color:var(--ink2)}
.set-ok{width:38px;height:34px;border-radius:9px;background:var(--soft);display:grid;place-items:center}
.set-ok svg{width:15px;height:15px;color:var(--faint)}
.set-row2.ok .set-ok{background:var(--green)}
.set-row2.ok .set-ok svg{color:#fff}
.ex-actions{display:flex;gap:6px;margin-top:8px}
.ex-nota{margin-top:8px;font-size:12.5px;padding:8px 10px;border-color:transparent;background:var(--soft);min-height:0;resize:none}
@media(max-width:420px){.set-head,.set-row2{grid-template-columns:30px minmax(52px,1fr) 58px 50px 46px 38px;gap:4px}}
.rest-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:60;width:min(560px,calc(100% - 24px));background:var(--accent);color:var(--accent-ink);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-lg)}
@media(min-width:861px){.rest-bar{left:calc(50% + var(--side)/2)}}
.rest-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(127,127,127,.25);transition:width .25s linear}
.rest-in{position:relative;display:flex;align-items:center;gap:8px;padding:12px 14px}
.rest-in span{font-size:12px;font-weight:600;opacity:.75}
.rest-in b{flex:1;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.rest-in button{color:inherit;font-weight:700;font-size:13px;padding:8px 11px;border-radius:10px;background:rgba(127,127,127,.22)}

/* alongamento */
.al-card{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.al-card b{display:block;font-size:16px;font-weight:700}
.al-card small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.al-card.sug{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.al-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:var(--green-soft);padding:3px 8px;border-radius:20px;margin-bottom:6px}
.al-steps{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.5}
@media(max-width:620px){.al-card{flex-direction:column;align-items:stretch}.al-card .btn{width:100%}}
.al-prog{display:flex;gap:3px;margin:4px 0 6px}
.al-prog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.al-prog i.d{background:var(--green)}
.al-prog i.c{background:var(--ink)}
.al-name{font-size:clamp(22px,4.5vw,30px);font-weight:800;letter-spacing:-.6px;margin-top:10px;line-height:1.2}
.al-play .p-time{font-size:clamp(76px,15vw,128px)}
.al-dica{max-width:440px;margin:16px auto 0;color:var(--ink2);font-size:14px;line-height:1.6}
.ck-line{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;background:var(--soft);margin-bottom:6px;font-size:13px;font-weight:500 !important;color:var(--ink2) !important;cursor:pointer}
.ck-line input{width:17px;height:17px;accent-color:var(--ink);flex-shrink:0}

/* ===== ALIMENTAÇÃO ===== */
.grid.hoje5{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
@media(max-width:860px){.grid.hoje5{grid-template-columns:1fr 1fr}}
.meal{display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:9px;border-left:4px solid var(--line)}
.meal.st-y{border-left-color:var(--green)} .meal.st-m{border-left-color:var(--amber)} .meal.st-n{border-left-color:var(--red)} .meal.st-l{border-left-color:#c9a227} .meal.st-x{border-left-color:var(--faint);opacity:.7}
.meal-t{flex:1;min-width:0}
.meal-h{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:8px}
.meal-t b{font-size:14.5px;font-weight:700}
.meal-t small{display:block;font-size:12px;color:var(--muted);line-height:1.45;margin-top:3px}
.meal-o{display:flex;gap:5px;flex-shrink:0}
.mo{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:56px;padding:6px 6px 5px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:10px;font-weight:600;color:var(--muted)}
.mo span{font-size:15px;line-height:1.1;font-weight:800}
.mo:hover{border-color:var(--faint)}
.mo.y.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.mo.m.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.mo.n.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.mo.l.on{background:#fbf3d6;border-color:#c9a227;color:#8a6d0f}
.mo.x.on{background:var(--soft);border-color:var(--faint);color:var(--ink2)}
:root[data-theme="dark"] .mo.l.on{background:#2b2512;color:#e2c45c}
@media(max-width:620px){.meal{flex-direction:column;align-items:stretch;gap:10px}.meal-o{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}.mo{min-width:0}}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);font-size:19px;font-weight:600;color:var(--ink2)}
.stepper b{min-width:34px;text-align:center;font-size:19px;font-weight:800}
.wk7i i.dn{width:10px;height:10px;border-radius:50%;display:inline-block;margin-top:3px}
.wk7i i.dn.g{background:var(--green)} .wk7i i.dn.a{background:var(--amber)} .wk7i i.dn.r{background:var(--red)}
.meta-in{width:72px;padding:2px 4px;border:none;background:transparent;font-size:20px;font-weight:800;letter-spacing:-.5px;box-shadow:none!important;border-bottom:1px dashed var(--faint);border-radius:0}
.plan-r{padding:14px 16px;margin-bottom:9px}
.plan-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pl-hora{width:auto;max-width:110px;padding:7px 8px}
.pl-nome{flex:1;font-weight:700;padding:7px 10px}
.pl-kcal{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.pl-kcal input{width:66px;padding:7px 6px;text-align:center}
.plan-r textarea{font-size:13px;color:var(--ink2)}
.hand{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hand b{display:block;font-size:14px}
.hand small{font-size:12px;color:var(--muted);line-height:1.5}
@media(max-width:620px){.hand{grid-template-columns:1fr}.plan-top{flex-wrap:wrap}.pl-nome{min-width:60%}}

/* ===== NUVEM ===== */
#auth{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px))}
.auth-box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;box-shadow:var(--shadow-lg)}
.auth-msg{font-size:13px;color:var(--ink2);text-align:center;margin-top:12px;min-height:18px;line-height:1.5}
.nv-status{font-size:11px;color:var(--muted)}
.nv-status[data-st="ok"]{color:var(--green)}
.nv-status[data-st="erro"]{color:var(--red)}
.nv-status[data-st="offline"]{color:var(--amber)}

</style>
</head>

  if (!S.mig.ciAntidoto) {

const isDone = (hid, day) => !!(S.logs[hid] && S.logs[hid][day]);
function toggleHabit(hid, day){
  if (day > todayISO()) return;
  S.logs[hid] ||= {};
  if (S.logs[hid][day]) delete S.logs[hid][day]; else S.logs[hid][day] = 1;
  save();
}
const habitTotal = (hid, year) => Object.keys(S.logs[hid]||{}).filter(k => !year || k.startsWith(year)).length;
function doneOnDay(day){ return S.habitos.filter(h => isDone(h.id, day)).length; }
function streak(){
  // dias seguidos com ao menos 1 hábito feito (hoje conta se já tiver algo; senão começa de ontem)
  let d = new Date(); if (!doneOnDay(iso(d))) d = addDays(d,-1);
  let n = 0; while (doneOnDay(iso(d)) > 0) { n++; d = addDays(d,-1); }
  return n;
}
function trajetoria(){
  const days = new Set(); Object.values(S.logs).forEach(o => Object.keys(o).forEach(k => days.add(k)));
  Object.keys(S.checkins).forEach(k => days.add(k));
  return days.size;
}
function weekStart(d){ const r = new Date(d); const wd = (r.getDay()+6)%7; r.setDate(r.getDate()-wd); r.setHours(0,0,0,0); return r; }

/* ---------- grade do ano (estilo pontos) ---------- */
function yearDots(year, levelFn){
  // colunas = semanas (segunda a domingo), linhas = dias da semana
  const first = new Date(year,0,1), last = new Date(year,11,31), t = todayISO();
  const start = addDays(first, -((first.getDay()+6)%7));
  const end = addDays(last, 6 - ((last.getDay()+6)%7));
  let cells = '', months = '', lastMonth = -1;
  for (let d = new Date(start); d <= end; d = addDays(d,1)) {
    if ((d.getDay()+6)%7 === 0) {
      // rótulo do mês na 1ª coluna que contém o dia 1..7 desse mês
      let lbl = '';
      for (let j = 0; j < 7; j++) { const dj = addDays(d,j); if (dj.getFullYear() === year && dj.getDate() === 1 && dj.getMonth() !== lastMonth) { lastMonth = dj.getMonth(); lbl = MES3[lastMonth]; } }
      months += `<span>${lbl}</span>`;
    }
    const k = iso(d);
    if (d.getFullYear() !== year) { cells += '<i style="visibility:hidden"></i>'; continue; }
    const lv = k > t ? 0 : levelFn(k);
    cells += `<i class="${lv?'l'+lv:''}${k>t?' fut':''}${k===t?' today':''}" title="${fmtShort(k)}"></i>`;
  }
  return `<div class="yr-wrap"><div class="yr">${cells}</div><div class="yr-months">${months}</div></div>`;
}

/* =========================================================
   VIEW: TAREFAS
   ========================================================= */
const PRI = {
  urgente:{t:'URGENTE', c:'var(--red)', o:0},
  alta:{t:'ALTA', c:'var(--amber)', o:1},
  media:{t:'MÉDIA', c:'var(--blue)', o:2},
  normal:{t:'NORMAL', c:'var(--muted)', o:3}
};
const STAT = {todo:'A fazer', doing:'Em progresso', done:'Concluído'};
let taskFilter = 'all';
function taskSort(a,b){
  const so = {doing:0, todo:1, done:2};
  if (so[a.status] !== so[b.status]) return so[a.status]-so[b.status];
  if (a.status === 'done') return (b.concluido||'').localeCompare(a.concluido||'');
  if (PRI[a.prioridade].o !== PRI[b.prioridade].o) return PRI[a.prioridade].o - PRI[b.prioridade].o;
  if ((a.prazo||'9') !== (b.prazo||'9')) return (a.prazo||'9').localeCompare(b.prazo||'9');
  return (a.criado||'').localeCompare(b.criado||'');
}
function setTaskStatus(x, st){ x.status = st; x.concluido = st === 'done' ? todayISO() : ''; save(); }
VIEWS.tarefas = function(){
  const cnt = s => S.tarefas.filter(x => x.status === s).length;
  const all = S.tarefas.slice().sort(taskSort);
  const list = taskFilter === 'all' ? all : all.filter(x => x.status === taskFilter);
  const minAbertos = S.tarefas.filter(x => x.status !== 'done').reduce((s,x) => s + (+x.min||0), 0);
  const t = todayISO();
  $('#main').innerHTML = `<div class="page narrow">
    <div class="ph"><div><h1>Tarefas</h1><div class="sub">${cnt('todo')} a fazer · ${cnt('doing')} em progresso · ${cnt('done')} concluídas${minAbertos ? ' · '+fmtMin(minAbertos)+' estimados' : ''}</div></div>
      <button class="btn btn-dark" id="newTask">${svg('plus')} Nova tarefa</button></div>
    <div class="task-add"><input id="quickTask" placeholder="Adicionar rápido: digite e aperte Enter"></div>
    <div class="chips" style="margin-bottom:20px">
      ${[['all','Tudo',S.tarefas.length],['todo','A fazer',cnt('todo')],['doing','Em progresso',cnt('doing')],['done','Concluído',cnt('done')]].map(([k,l,n]) => `<button class="chip ${taskFilter===k?'on':''}" data-f="${k}">${l} <span class="n">${n}</span></button>`).join('')}
    </div>
    <div id="taskList">${list.map(x => { const p = PRI[x.prioridade]||PRI.normal; const late = x.prazo && x.status !== 'done' && x.prazo < t; return `<div class="card task ${x.status}" data-id="${x.id}" style="--pc:${p.c}">
      <button class="circ" data-circ title="${x.status==='done'?'Reabrir':'Concluir'}">${CHECK}</button>
      <div class="tt"><b>${esc(x.titulo)}</b><div class="meta"><span class="pr">${p.t}</span>${x.min ? `<span>${svg('clock')}${fmtMin(x.min)}</span>` : ''}${x.prazo ? `<span style="${late?'color:var(--red);font-weight:600':''}">${svg('cal')}${late?'atrasada · ':''}${fmtShort(x.prazo)}</span>` : ''}${x.notas ? '<span>· com notas</span>' : ''}</div></div>
      ${x.status === 'doing' ? '<span class="stbadge">EM PROGRESSO</span>' : ''}
    </div>`; }).join('') || `<div class="empty"><div class="big">${taskFilter==='done'?'📭':'🎉'}</div>${taskFilter==='done'?'Nenhuma tarefa concluída ainda.':'Nada por aqui.'}</div>`}</div>
  </div>`;
  $$('.chip[data-f]').forEach(b => b.onclick = () => { taskFilter = b.dataset.f; render(); });
  $('#newTask').onclick = () => taskModal(null);
  $('#quickTask').onkeydown = e => { if (e.key === 'Enter' && e.target.value.trim()) { S.tarefas.push({id:uid('t'), titulo:e.target.value.trim(), prioridade:'normal', min:0, status:'todo', prazo:'', notas:'', criado:todayISO(), concluido:''}); save(); toast('Tarefa adicionada ✓'); render(); setTimeout(()=>$('#quickTask').focus(),0); } };
  $$('.task').forEach(el => el.onclick = e => {
    const x = S.tarefas.find(z => z.id === el.dataset.id);
    if (e.target.closest('[data-circ]')) { setTaskStatus(x, x.status === 'done' ? 'todo' : 'done'); toast(x.status === 'done' ? 'Concluída ✓' : 'Reaberta'); render(); return; }
    taskModal(x);
  });
};
function taskModal(x){
  const novo = !x; x = x || {titulo:'', prioridade:'media', min:'', status:'todo', prazo:'', notas:''};
  openModal(`<h3>${novo ? 'Nova tarefa' : 'Editar tarefa'}</h3>
    <div class="field"><label>Título</label><input id="mT" value="${esc(x.titulo)}" placeholder="O que precisa ser feito?" autofocus></div>
    <div class="row2">
      <div class="field"><label>Prioridade</label><select id="mP">${Object.keys(PRI).map(k => `<option value="${k}" ${x.prioridade===k?'selected':''}>${cap(PRI[k].t.toLowerCase())}</option>`).join('')}</select></div>
      <div class="field"><label>Tempo estimado (min)</label><input id="mM" type="number" min="0" step="5" value="${x.min||''}" placeholder="Ex.: 30"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Status</label><select id="mS">${Object.keys(STAT).map(k => `<option value="${k}" ${x.status===k?'selected':''}>${STAT[k]}</option>`).join('')}</select></div>
      <div class="field"><label>Prazo (opcional)</label><input id="mD" type="date" value="${x.prazo||''}"></div>
    </div>
    <div class="field"><label>Notas</label><textarea id="mN" rows="3" placeholder="Detalhes, links, passos...">${esc(x.notas||'')}</textarea></div>
    <div class="foot">${novo ? '' : `<button class="btn btn-danger" id="mDel">${svg('trash')} Excluir</button>`}<span class="sp"></span><button class="btn btn-ghost" data-x>Cancelar</button><button class="btn btn-dark" id="mOk">${novo ? 'Adicionar' : 'Salvar'}</button></div>`,
  b => {
    b.querySelector('[data-x]').onclick = closeModal;
    b.querySelector('#mT').onkeydown = e => { if (e.key === 'Enter') b.querySelector('#mOk').click(); };
    b.querySelector('#mOk').onclick = () => {
      const titulo = b.querySelector('#mT').value.trim(); if (!titulo) { b.querySelector('#mT').focus(); return; }
      const st = b.querySelector('#mS').value;
      const data = {titulo, prioridade:b.querySelector('#mP').value, min:+b.querySelector('#mM').value||0, prazo:b.querySelector('#mD').value, notas:b.querySelector('#mN').value.trim()};
      if (novo) S.tarefas.push(Object.assign({id:uid('t'), criado:todayISO(), status:st, concluido: st==='done'?todayISO():''}, data));
      else { Object.assign(x, data); if (x.status !== st) setTaskStatus(x, st); }
      save(); closeModal(); toast(novo ? 'Tarefa adicionada ✓' : 'Tarefa salva ✓'); render();
    };
    const d = b.querySelector('#mDel'); if (d) d.onclick = () => confirmBox(`Excluir a tarefa <b>${esc(x.titulo)}</b>?`, 'Excluir', () => { S.tarefas = S.tarefas.filter(z => z !== x); save(); toast('Tarefa excluída'); render(); });
  });
}

/* =========================================================
   VIEW: HÁBITOS

let habView = 'mes', habMonth = null, addingHabit = false;
VIEWS.habitos = function(){
  const now = new Date(); habMonth ||= new Date(now.getFullYear(), now.getMonth(), 1);
  const y = habMonth.getFullYear(), m = habMonth.getMonth(), t = todayISO();
  $('#main').innerHTML = `<div class="page wide">
    <div class="ph"><div><h1>Rastreador</h1><div class="sub">Consistência é a chave.</div></div>
      <div class="seg"><button class="${habView==='mes'?'on':''}" data-v="mes">${svg('grid')}Mês</button><button class="${habView==='ano'?'on':''}" data-v="ano">${svg('cal')}Ano</button></div></div>
    <div id="habBody"></div></div>`;
  $$('.seg [data-v]').forEach(b => b.onclick = () => { habView = b.dataset.v; render(); });
  habView === 'mes' ? habMonthView(y, m, t) : habYearView(now.getFullYear(), t);
};
function habMonthView(y, m, t){
  const nd = new Date(y, m+1, 0).getDate();
  const cols = `minmax(140px,180px) repeat(${nd}, minmax(25px,1fr))`;
  let g = `<div class="hd first">Hábitos</div>`;
  for (let d = 1; d <= nd; d++) { const k = y+'-'+pad2(m+1)+'-'+pad2(d); g += `<div class="hd ${k===t?'today col-today':''}">${d}</div>`; }
  S.habitos.forEach((h, i) => {
    g += `<div class="hname"><div class="t"><b title="${esc(h.titulo)}">${esc(h.titulo)}</b><small>${habitTotal(h.id, String(y))} / ${(y%4===0)?366:365} dias</small></div><button class="more" data-more="${h.id}" aria-label="Opções">${svg('dots')}</button></div>`;
    for (let d = 1; d <= nd; d++) {
      const k = y+'-'+pad2(m+1)+'-'+pad2(d), on = isDone(h.id, k), fut = k > t;
      g += `<div class="hcell ${k===t?'col-today':''}"><button class="ck ${on?'on':''} ${fut?'fut':''}" data-h="${h.id}" data-d="${k}" title="${esc(h.titulo)} · ${fmtShort(k)}" ${fut?'disabled':''}>${CHECK}</button></div>`;
    }
  });
  const body = $('#habBody');
  body.innerHTML = `
    <div class="card mbar">
      <div class="mnav"><button class="icon-btn" id="mPrev" aria-label="Mês anterior">${svg('left')}</button><div class="mname">${cap(MES[m])} ${y}</div><button class="icon-btn" id="mNext" aria-label="Próximo mês">${svg('right')}</button></div>
      ${addingHabit ? `<div class="newhab"><input id="nhIn" placeholder="Nome do hábito..." autofocus><button class="btn btn-dark btn-sm" id="nhOk" aria-label="Salvar">${svg('check','stroke-width="2.6"')}</button><button class="btn btn-ghost btn-sm" id="nhX" aria-label="Cancelar">${svg('x')}</button></div>`
        : `<button class="btn btn-dark" id="nhBtn">${svg('plus')} Novo hábito</button>`}
    </div>
    <div class="card hgrid-card">${S.habitos.length ? `<div class="hgrid" style="grid-template-columns:${cols}">${g}</div>` : '<div class="empty">Você ainda não tem hábitos cadastrados.</div>'}</div>
    ${S.habitos.length ? `<div class="sec-label">Desempenho semanal — últimos 3 meses</div><div class="grid g2">${S.habitos.map(weekCard).join('')}</div>` : ''}`;
  // em telas estreitas, rola a grade até o dia de hoje
  const gc = body.querySelector('.hgrid-card'), th = body.querySelector('.hgrid .hd.today');
  if (gc && th && gc.scrollWidth > gc.clientWidth) gc.scrollLeft = Math.max(0, th.offsetLeft - gc.clientWidth + th.offsetWidth * 3);
  $('#mPrev').onclick = () => { habMonth = new Date(y, m-1, 1); render(); };
  $('#mNext').onclick = () => { habMonth = new Date(y, m+1, 1); render(); };
  if (addingHabit) {
    const inp = $('#nhIn'); setTimeout(() => inp.focus(), 0);
    const ok = () => { const v = inp.value.trim(); if (!v) return; S.habitos.push({id:uid('h'), titulo:v, criado:todayISO()}); save(); addingHabit = false; toast('Hábito criado ✓'); render(); };
    $('#nhOk').onclick = ok; $('#nhX').onclick = () => { addingHabit = false; render(); };
    inp.onkeydown = e => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') { addingHabit = false; render(); } };
  } else $('#nhBtn').onclick = () => { addingHabit = true; render(); };
  $$('.hcell .ck').forEach(b => b.onclick = () => {
    if (b.disabled) return;
    toggleHabit(b.dataset.h, b.dataset.d); b.classList.toggle('on', isDone(b.dataset.h, b.dataset.d));
    const h = S.habitos.find(z => z.id === b.dataset.h);
    const sm = b.closest('.hgrid').querySelector(`[data-more="${h.id}"]`).parentElement.querySelector('small');
    sm.textContent = habitTotal(h.id, String(y)) + ' / ' + ((y%4===0)?366:365) + ' dias';
  });
  $$('[data-more]').forEach(b => b.onclick = e => { e.stopPropagation(); habitMenu(b, b.dataset.more); });
}
function habitMenu(anchor, hid){
  const i = S.habitos.findIndex(h => h.id === hid), h = S.habitos[i];
  const items = [{t:'Editar', ic:'edit', fn:() => openModal(`<h3>Editar hábito</h3><div class="field"><label>Nome</label><input id="ehIn" value="${esc(h.titulo)}" autofocus></div><div class="foot"><button class="btn btn-ghost" data-x>Cancelar</button><button class="btn btn-dark" id="ehOk">Salvar</button></div>`, b => {
      b.querySelector('[data-x]').onclick = closeModal;
      const ok = () => { const v = b.querySelector('#ehIn').value.trim(); if (!v) return; h.titulo = v; save(); closeModal(); render(); toast('Hábito renomeado ✓'); };
      b.querySelector('#ehOk').onclick = ok; b.querySelector('#ehIn').onkeydown = e => { if (e.key === 'Enter') ok(); };
    })}];

function weekCard(h){
  const ws = weekStart(new Date()), weeks = [];
  for (let i = 12; i >= 0; i--) weeks.push(addDays(ws, -7*i));
  const counts = weeks.map(w => { let c = 0; for (let d = 0; d < 7; d++) if (isDone(h.id, iso(addDays(w,d)))) c++; return c; });
  const total = counts.reduce((a,b) => a+b, 0), best = Math.max(...counts);
  const firstActive = counts.findIndex(c => c > 0);
  const nWeeks = firstActive < 0 ? 13 : 13 - firstActive;
  let lastM = -1;
  const lbls = weeks.map(w => { const mm = w.getMonth(); if (mm !== lastM) { lastM = mm; return cap(MES3[mm]); } return ''; });
  return `<div class="card wk-card"><h4>${esc(h.titulo)}</h4>
    <div class="wk-bars">${counts.map(c => `<div class="wk-bar">${c?`<span>${c}</span>`:''}<i class="${c?'':'zero'}" style="${c?`height:${c/7*100}%`:''}"></i></div>`).join('')}</div>
    <div class="wk-lbl">${lbls.map(l => `<span>${l}</span>`).join('')}</div>
    <div class="wk-stats"><div><b>${nf(total/Math.max(1,nWeeks),1)}</b><small>média/sem</small></div><div><b>${best}</b><small>melhor sem</small></div><div><b>${total}</b><small>total dias</small></div></div>
  </div>`;
}

function treinoSeed(){
  const ex = {};
  Object.entries(EX_LIB).forEach(([id,[nome,grupo,tipo,a,b,inc]]) => ex[id] = {id, nome, grupo, tipo, faixa:[a,b], inc});
  const rotinas = {};
  ROT_BASE.forEach(([id,nome,sub,perna,itens]) => rotinas[id] = {id, nome, sub, perna, itens:itens.map(([e,n]) => ({ex:e, series:n}))});
  return {v:2, ex, rotinas, seq:['pa','pot','cb','pb','pbr','co'], prox:0, adiantados:[], sessoes:[], ativo:null, atividades:[], pesos:[], cfg:{hora:'09:00', sexta:'depois do almoço'}};
}
const T = () => S.treino;
const exInfo = id => T().ex[id] || {id, nome:id, grupo:'', tipo:'i', faixa:[8,12], inc:0};
const isPC = id => exInfo(id).tipo === 'pc';
const descansoDe = (id, warm) => warm ? 60 : ({c:150, i:75, pc:90})[exInfo(id).tipo] || 90;
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? null : n; };
const e1rm = (kg, reps) => kg * (1 + reps/30);
const kgTxt = v => nf(v, 2).replace(/,00$/, '');
const proxRotina = () => T().rotinas[T().seq[T().prox % T().seq.length]];
function rotinaPerna(r){ return !!(r && (r.perna || r.itens.some(it => exInfo(it.ex).grupo === 'Pernas'))); }
function horaTreino(d){ return (d || new Date()).getDay() === 5 ? T().cfg.sexta : 'às ' + T().cfg.hora.replace(':00','h').replace(':','h'); }

/* ---------- histórico ---------- */
function sessoesFeitas(){ return T().sessoes.slice().sort((a,b) => a.inicio.localeCompare(b.inicio)); }
function workSets(item){ return item.sets.filter(s => s.ok && s.t !== 'w' && num(s.reps)); }
function ultimaVez(exId, antesDe){
  const ss = sessoesFeitas();
  for (let i = ss.length-1; i >= 0; i--) {
    if (antesDe && ss[i].inicio >= antesDe) continue;
    const it = ss[i].itens.find(x => x.ex === exId && x.sets.some(s => s.ok));
    if (it) return {sessao:ss[i], item:it};
  }
  return null;
}
function melhorMarca(exId, antesDe){
  let best = null;
  T().sessoes.forEach(s => { if (antesDe && s.inicio >= antesDe) return; s.itens.forEach(it => { if (it.ex !== exId) return; workSets(it).forEach(z => {
    const kg = num(z.kg) || 0, r = num(z.reps), e = isPC(exId) ? r : e1rm(kg, r);
    if (!best || e > best.e) best = {kg, reps:r, e, data:s.data};
  }); }); });
  return best;
}
// sugestão de carga: bateu o topo da faixa em todas as séries de trabalho da última vez → sobe
function sugestao(exId){
  const u = ultimaVez(exId); if (!u) return null;
  const ws = workSets(u.item); if (!ws.length) return null;
  const x = exInfo(exId), top = x.faixa[1], lastKg = num(ws[0].kg) || 0;
  const bateu = ws.every(z => num(z.reps) >= top);
  if (isPC(exId)) return {kg:null, sobe:bateu, txt: bateu ? 'Bateu o topo: tente +1 rep por série' : ''};
  if (!bateu) return {kg:lastKg, sobe:false, txt:''};
  if (x.inc > 0) return {kg:lastKg + x.inc, sobe:true, txt:`Bateu ${top} em tudo: suba para ${kgTxt(lastKg + x.inc)} kg`};
  return {kg:lastKg, sobe:true, txt:'Bateu o topo em tudo: suba 1 pino'};
}

/* ---------- sessão ativa ---------- */
function novoItem(exId, series){
  const sg = sugestao(exId), u = ultimaVez(exId);
  const kg0 = sg && sg.kg != null ? kgTxt(sg.kg) : (u && workSets(u.item)[0] ? String(workSets(u.item)[0].kg || '') : '');
  return {ex:exId, sets:[...Array(series)].map(() => ({t:'n', kg:isPC(exId) ? '' : kg0, reps:'', rir:'', ok:false})), nota:''};
}

function avancarSequencia(rotId){
  const t = T(), n = t.seq.length;
  if (!t.seq.includes(rotId)) return;                       // treinos fora da sequência não mexem nela
  if (t.seq[t.prox % n] === rotId) {
    t.prox = (t.prox + 1) % n;
    let guard = 0;
    while (t.adiantados.includes(t.seq[t.prox]) && guard++ < n) { t.adiantados = t.adiantados.filter(x => x !== t.seq[t.prox]); t.prox = (t.prox + 1) % n; }
  } else if (!t.adiantados.includes(rotId)) t.adiantados.push(rotId);
}

const fmtSeg = s => s >= 60 ? (s % 60 ? Math.floor(s/60) + 'min' + pad2(s%60) : (s/60) + ' min') : s + 's';
function escolherEx(cb, atual){

  openModal(`<h3>${atual ? 'Trocar exercício' : 'Adicionar exercício'}</h3><input id="peQ" placeholder="Buscar exercício..." autofocus><div class="pick-list" id="peL" style="margin-top:10px;max-height:50vh;overflow:auto">${draw('')}</div>

function finalizarTreino(){

    ${difs.length ? `<div class="field"><label>Atualizar a rotina para as próximas vezes?</label>${difs.map((d,k) => `<label class="ck-line"><input type="checkbox" data-dif="${k}"> ${esc(exInfo(d.ex).nome)}: ${d.de} → <b>${d.para}</b> séries</label>`).join('')}</div>` : ''}
    ${perna ? `<div class="field"><label>Como ficou o joelho? <b id="jV" style="color:var(--ink)">0</b>/10</label><input type="range" id="jR" min="0" max="10" step="1" value="0"><div class="muted" id="jT" style="font-size:12px;margin-top:6px">Até 3, e passando até amanhã: tudo certo.</div></div>` : ''}
    <div class="field"><label>Como foi o treino? (opcional)</label><textarea id="fN" rows="2" placeholder="Energia, sono, algo que incomodou..."></textarea></div>
    <div class="foot"><button class="btn btn-ghost" data-x>Voltar</button><button class="btn btn-dark" id="fOk">Salvar treino</button></div>`, b => {

/* ---------- gráficos ---------- */
function barChart(vals, labels, minMax=0){
  const W = 520, H = 170, pl = 30, pb = 22, pt = 14, n = vals.length;
  const max = Math.max(minMax, ...vals, 1), bw = (W-pl-8)/n;
  const ticks = [0, max/2, max].map(v => Math.round(v));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach(tk => { const y = H-pb - (tk/max)*(H-pb-pt); s += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${tk>=1000?nf(tk/1000,1)+'k':tk}</text>`; });
  vals.forEach((v,i) => { const h = (v/max)*(H-pb-pt), x = pl + i*bw + bw*.18, w = bw*.64, y = H-pb-h;
    s += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h, v?2:0)}" rx="3" fill="var(--done)"><title>${labels[i]}: ${nf(v)}</title></rect>`;
    if (i % 2 === (n-1) % 2) s += `<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`; });
  return s + '</svg>';
}
function lineChart(pts, o={}){
  const W = 620, H = 210, pl = 40, pr = 12, pt = 16, pb = 24, unit = o.unit || 'kg';
  const ys = pts.map(p => p.y), min = Math.min(...ys), max = Math.max(...ys), pad = Math.max((max-min)*.15, max*0.01, 0.5);
  const lo = Math.max(0, min - pad), hi = max + pad;
  const t0 = parseISO(pts[0].x).getTime(), t1 = Math.max(t0+86400000, parseISO(pts[pts.length-1].x).getTime());
  const X = d => pl + (parseISO(d).getTime()-t0)/(t1-t0)*(W-pl-pr), Y = v => H-pb - (v-lo)/(hi-lo)*(H-pb-pt);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  [lo, (lo+hi)/2, hi].forEach(v => { s += `<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+3}" text-anchor="end">${nf(v,1)}</text>`; });
  s += `<polyline fill="none" stroke="var(--done)" stroke-width="2" stroke-linejoin="round" points="${pts.map(p => X(p.x)+','+Y(p.y)).join(' ')}"/>`;
  pts.forEach(p => { s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3.5" fill="var(--card)" stroke="var(--done)" stroke-width="2"><title>${fmtShort(p.x)}: ${nf(p.y,1)} ${unit}${o.reps && p.r ? ' × ' + p.r : ''}</title></circle>`; });
  const step = Math.max(1, Math.ceil(pts.length/6));
  pts.forEach((p,i) => { if (i % step === 0 || i === pts.length-1) s += `<text x="${X(p.x)}" y="${H-6}" text-anchor="middle">${fmtShort(p.x)}</text>`; });
  return s + '</svg>';
}

function resumoSemana(ini){
  const dias = [...Array(7)].map((_,i) => iso(addDays(ini,i))), hoje = todayISO();
  let pts = 0, tot = 0, livres = 0;
  dias.forEach(dia => {
    if (dia > hoje) return; const d = D().dias[dia]; if (!d) return;
    if (isFDS(dia)) { if (d.prot != null) { tot++; pts += d.prot === true ? 1 : d.prot === 'meio' ? .5 : 0; } livres += +d.livres || 0; return; }
    Object.values(d.ref || {}).forEach(v => {
      if (v === 'na') return;
      if (v === 'livre') { livres++; tot++; pts += livres <= D().livresSemana ? 1 : 0; return; }
      tot++; pts += v === 'sim' ? 1 : v === 'meio' ? .5 : 0;
    });
    if (d.prot != null) { tot++; pts += d.prot ? 1 : 0; }
  });

const pomoMinHoje = () => P().sessoes.filter(s => s.data === todayISO()).reduce((a,s) => a + s.min, 0);
const pomoMinTotal = () => P().sessoes.reduce((a,s) => a + s.min, 0);
function pomoRestante(){ const r = P().run; if (!r) return P().cfg.foco*60; return r.rodando ? Math.max(0, (r.fim - Date.now())/1000) : r.resta; }
const mmss = s => { s = Math.ceil(s); return pad2(Math.floor(s/60)) + ':' + pad2(s%60); };

let audioCtx = null;
function audio(){ try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){} return audioCtx; }
function tone(ctx, t, freq, type, dur, vol){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.015); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.start(t); o.stop(t+dur+0.05);
}
function playSom(tipo){
  const ctx = audio(); if (!ctx) return; const t = ctx.currentTime + 0.05;
  if (tipo === 'sino') { [0, 0.9, 1.8].forEach(d => { tone(ctx, t+d, 880, 'sine', 1.5, 0.35); tone(ctx, t+d, 1760, 'sine', 0.9, 0.08); }); }
  else if (tipo === 'digital') { [0, .2, .4, .6, 1.1, 1.3, 1.5, 1.7].forEach(d => tone(ctx, t+d, 1050, 'square', 0.11, 0.12)); }
  else { [523.25, 659.25, 783.99, 1046.5].forEach((f,i) => tone(ctx, t+i*0.32, f, 'triangle', 1.8, 0.28)); }
}
function notificar(titulo, corpo){
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification(titulo, {body:corpo, silent:true}); } catch(e){}
}
function pomoLog(min, tag, inicio){
  if (min < 1) return;
  const d = new Date(inicio);
  P().sessoes.push({id:uid('ps'), tag, min:Math.round(min), data:iso(d), inicio:d.toISOString()});
}
function pomoStart(){
  audio();
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch(e){}
  const p = P(), now = Date.now();
  if (!p.run) {
    const dur = p.cfg.foco*60;
    p.run = {fase:'foco', round:1, total:p.cfg.rounds, dur, rodando:true, fim:now + dur*1000, resta:dur, tag:p.cfg.tag, inicio:new Date().toISOString()};
  } else if (!p.run.rodando) { p.run.rodando = true; p.run.fim = now + p.run.resta*1000; }
  save(); pomoTick(true);
}
function pomoPause(){ const r = P().run; if (!r || !r.rodando) return; r.resta = Math.max(0, (r.fim - Date.now())/1000); r.rodando = false; save(); pomoTick(true); }
function pomoFase(fase, round){
  const p = P(), dur = (fase === 'foco' ? p.cfg.foco : p.cfg.pausa) * 60;
  p.run = {fase, round, total:p.run.total, dur, rodando:true, fim:Date.now() + dur*1000, resta:dur, tag:p.run.tag, inicio:new Date().toISOString()};
}
// fim de uma fase (natural ou pulada)
function pomoFimFase(pulou){
  const p = P(), r = p.run; if (!r) return;
  if (r.fase === 'foco') {
    const feito = pulou ? (r.dur - pomoRestante())/60 : r.dur/60;
    pomoLog(feito, r.tag, r.inicio);
    const ultimo = r.round >= r.total;
    if (!pulou) { playSom(p.cfg.som); notificar(ultimo ? 'Pomodoro concluído' : 'Hora da pausa', `${Math.round(feito)} min de foco em ${tagNome(r.tag)}`); }
    if (ultimo) { p.run = null; toast(pulou ? 'Foco encerrado e registrado' : `Ciclo concluído · ${Math.round(feito)} min de foco ✓`); }
    else if (p.cfg.pausa > 0) { pomoFase('pausa', r.round); toast('Pausa de ' + p.cfg.pausa + ' min'); }
    else pomoFase('foco', r.round + 1);
  } else {
    if (!pulou) { playSom(p.cfg.som); notificar('Fim da pausa', 'Round ' + (r.round+1) + ' de ' + r.total); }
    pomoFase('foco', r.round + 1);
  }
  save();
}
function pomoParar(){
  const r = P().run; if (!r) return;
  const feito = r.fase === 'foco' ? (r.dur - pomoRestante())/60 : 0;
  if (feito < 1) { P().run = null; save(); pomoTick(true); return; }
  openModal(`<h3>Parar o pomodoro?</h3><p style="color:var(--ink2);line-height:1.6">Você já fez <b>${Math.floor(feito)} min</b> de foco em <b>${esc(tagNome(r.tag))}</b> neste round.</p>
    <div class="foot"><button class="btn btn-ghost" data-x>Continuar</button><button class="btn btn-danger" id="pDesc">Descartar</button><button class="btn btn-dark" id="pSalv">Salvar ${Math.floor(feito)} min</button></div>`, b => {
    b.querySelector('[data-x]').onclick = closeModal;
    b.querySelector('#pDesc').onclick = () => { P().run = null; save(); closeModal(); toast('Pomodoro descartado'); render(); };
    b.querySelector('#pSalv').onclick = () => { pomoLog(Math.floor(feito), r.tag, r.inicio); P().run = null; save(); closeModal(); toast(Math.floor(feito) + ' min registrados ✓'); render(); };
  });
}
let lastTitle = '';
function pomoTick(forceRender){
  const p = P(), r = p.run;
  if (r && r.rodando && Date.now() >= r.fim) { pomoFimFase(false); forceRender = true; }
  const rr = p.run, rest = pomoRestante();
  // título da aba e selo no menu
  const base = (ROUTES.find(x => x.id === route) || {t:'Ajustes'}).t + ' · App Thiago';
  const ttl = rr ? `${rr.rodando ? '▶' : '❚❚'} ${mmss(rest)} · ${rr.fase === 'foco' ? 'Foco' : 'Pausa'}` : base;
  if (ttl !== lastTitle) { document.title = ttl; lastTitle = ttl; }
  const badge = $('#pomoBadge');
  if (badge) { badge.textContent = rr ? mmss(rest) : ''; badge.classList.toggle('pausa', !!rr && rr.fase === 'pausa'); badge.classList.toggle('parado', !!rr && !rr.rodando); }
  if (route !== 'pomodoro') return;
  if (forceRender) { render(); return; }
  const tm = $('#pTime'); if (tm) tm.textContent = mmss(rest);
  const bar = $('#pBar'); if (bar) bar.style.width = (rr ? (1 - rest/rr.dur)*100 : 0) + '%';
}

  </div>`;

  $('#pPlay').onclick = () => (r && r.rodando) ? pomoPause() : pomoStart();
  $('#pStop').onclick = pomoParar;
  $('#pSkip').onclick = () => { pomoFimFase(true); render(); };
  $$('.tagchip').forEach(el => el.onclick = e => {
    if (e.target.closest('.tg-ed')) return tagModal(P().tags.find(t => t.id === el.dataset.tag));
    c.tag = c.tag === el.dataset.tag ? '' : el.dataset.tag; if (r && !r.rodando && r.fase === 'foco' && r.resta === r.dur) r.tag = c.tag; save(); render();

      };

const FIN_CSS = `<style id="appThiagoEmbed">
@media(min-width:821px){
  .app{display:flex!important;flex-direction:column}
  .side{display:none!important}
  .mobile-nav{display:flex!important;order:-1;position:sticky!important;top:0;bottom:auto!important;left:auto;right:auto;z-index:60;background:var(--card);border-top:none!important;border-bottom:1px solid var(--border);padding:8px 24px;gap:4px;flex-wrap:wrap}

  .main{margin:0 auto}
}</style>`;
const decodeB64 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
const embedCache = {};
function embedHTML(k){
  if (embedCache[k]) return embedCache[k];
  let h = decodeB64(EMBEDS[k]);
  if (k === 'financas') h = h.replace('</head>', FIN_CSS + '</head>');
  // no link publicado, confirm() sempre responde "não" e alert() não aparece: confirma tudo, menos apagar todos os dados
  if (PUBLICO) h = h.replace('<head>', '<head><script>window.confirm=function(m){return !/TODOS os dados|Reiniciar|do zero/i.test(String(m))};window.alert=function(m){console.log(m)};<\/script>');
  return (embedCache[k] = h);
}
function frame(k, nobar){ return `<iframe class="embed-frame ${nobar?'nobar':''}" id="fr-${k}" title="${k}"></iframe>`; }
function mountFrame(k){ const f = $('#fr-'+k); if (f) f.srcdoc = embedHTML(k); }

function restaurarBackup(d){
  if (!d || !d.chaves) throw new Error('formato');
  const ks = Object.keys(d.chaves).filter(k => k === KEY || Object.values(EMBED_KEYS).includes(k));
  const quando = d.criadoEm ? new Date(d.criadoEm).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : 'data desconhecida';
  openModal(`<h3>Restaurar backup</h3><p class="muted" style="font-size:13px;margin:-8px 0 14px">Backup de ${quando} · ${ks.length} áreas</p>
    <div class="pick-list">
      <button class="pick" id="rbJ"><b>Juntar com o que já está aqui</b><small>Mantém tudo e acrescenta o que falta: treinos, pesos, hábitos, check-ins, tarefas, alimentação. Em Finanças e Bíblia, fica a versão com mais dados.</small></button>
      <button class="pick" id="rbS"><b>Substituir tudo</b><small>Apaga os dados atuais e coloca os do backup no lugar.</small></button>
    </div><div class="foot"><button class="btn btn-ghost" data-x>Cancelar</button></div>`, b => {
    b.querySelector('[data-x]').onclick = closeModal;
    const fim = msg => { closeModal(); load(); applyTheme(); toast(msg); render(); };
    b.querySelector('#rbS').onclick = () => confirmBox('Substituir todos os dados atuais pelos do backup?', 'Substituir', () => { ks.forEach(k => { try { localStorage.setItem(k, d.chaves[k]); } catch(e){} }); fim('Backup restaurado ✓'); });
    b.querySelector('#rbJ').onclick = () => {
      ks.forEach(k => { try {
        if (k === KEY) { const bb = JSON.parse(d.chaves[k]); S = juntarApp(S, bb); save(); }
        else { const cur = lsGet(k); if (!cur || d.chaves[k].length > cur.length) localStorage.setItem(k, d.chaves[k]); }
      } catch(e){} });
      fim('Backup juntado ✓');
    };
  });
}
VIEWS.ajustes = function(){

const SUPA = { url: 'https://rsdxjptswrvslzbwngue.supabase.co', key: 'sb_publishable_45AKUWGcIYIXwMxmwiXAhA_9ZCr4K9Y' };

const SYNC_KEYS = () => [KEY, ...Object.values(EMBED_KEYS)];
function hashStr(s){ let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return s.length + ':' + h; }
function syncMeta(){ try { return JSON.parse(localStorage.getItem(SM_KEY)) || {}; } catch(e){ return {}; } }
function setSyncMeta(m){ try { localStorage.setItem(SM_KEY, JSON.stringify(m)); } catch(e){} }
function nvStatus(st, erro){
  nv.status = st; if (st === 'ok') nv.quando = new Date(); nv.erro = erro || '';
  const txt = st === 'ok' ? `Sincronizado ✓ ${nv.quando.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}` : st === 'salvando' ? 'Salvando na nuvem…' : st === 'offline' ? 'Sem internet · salvo no aparelho' : st === 'erro' ? 'Erro ao sincronizar · salvo no aparelho' : '';

// envia as áreas que mudaram desde a última sincronização
let pushing = false;
async function nuvemPush(){
  if (!sb || !nuvemUser || pushing) return;
  const m = syncMeta(); m.ultimo ||= {}; m.sujo ||= {};
  const mudou = SYNC_KEYS().filter(k => { const v = lsGet(k); return v != null && hashStr(v) !== m.ultimo[k]; });
  if (!mudou.length) return;
  if (!navigator.onLine) return nvStatus('offline');
  pushing = true; nvStatus('salvando');
  try {
    const rows = mudou.map(k => { const v = lsGet(k); m.sujo[k] ||= new Date().toISOString(); return {user_id:nuvemUser.id, chave:k, valor:v, atualizado:new Date().toISOString(), _h:hashStr(v)}; });
    const { error } = await sb.from('estado').upsert(rows.map(({_h, ...r}) => r), {onConflict:'user_id,chave'});
    if (error) throw error;
    rows.forEach(r => { m.ultimo[r.chave] = r._h; delete m.sujo[r.chave]; });
    m.puxado = new Date().toISOString(); setSyncMeta(m); nvStatus('ok');
  } catch(e){ nvStatus(navigator.onLine ? 'erro' : 'offline', e.message); }
  pushing = false;
}
// traz da nuvem o que outro aparelho mudou
async function nuvemPull(primeira){
  if (!sb || !nuvemUser) return false;
  if (!navigator.onLine) { nvStatus('offline'); return false; }
  try {
    const { data, error } = await sb.from('estado').select('chave,valor,atualizado');
    if (error) throw error;
    const m = syncMeta(); m.ultimo ||= {}; m.sujo ||= {};
    let mudouApp = false, mudouEmbed = false;
    (data || []).forEach(r => {
      if (!SYNC_KEYS().includes(r.chave)) return;
      const local = lsGet(r.chave);
      if (local === r.valor) { m.ultimo[r.chave] = hashStr(r.valor); return; }
      const localMexido = local != null && hashStr(local) !== m.ultimo[r.chave];
      // se este aparelho mudou algo ainda não enviado, vence o mais recente
      if (localMexido && !primeira && m.sujo[r.chave] && new Date(m.sujo[r.chave]) > new Date(r.atualizado)) return;
      try { localStorage.setItem(r.chave, r.valor); } catch(e){ return; }
      m.ultimo[r.chave] = hashStr(r.valor); delete m.sujo[r.chave];
      if (r.chave === KEY) mudouApp = true; else mudouEmbed = true;
    });
    setSyncMeta(m); nvStatus('ok');
    if (appIniciado && (mudouApp || mudouEmbed)) {
      if (mudouApp) { load(); applyTheme(); }
      Object.keys(embedCache || {}).forEach(k => delete embedCache[k]);
      const editando = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if (!editando && $('#modal').classList.contains('hidden')) render();
    }
    return mudouApp || mudouEmbed;
  } catch(e){ nvStatus(navigator.onLine ? 'erro' : 'offline', e.message); return false; }
}
function nuvemLoop(){
  // detecta mudanças (inclusive as feitas dentro de Finanças e Bíblia) e envia
  setInterval(() => {
    const m = syncMeta(); m.ultimo ||= {}; m.sujo ||= {}; let marcou = false;
    SYNC_KEYS().forEach(k => { const v = lsGet(k); if (v != null && hashStr(v) !== m.ultimo[k] && !m.sujo[k]) { m.sujo[k] = new Date().toISOString(); marcou = true; } });
    if (marcou) setSyncMeta(m);
    nuvemPush();
  }, 3000);
  setInterval(() => { if (!document.hidden) nuvemPull(false); }, 45000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) nuvemPull(false); else nuvemPush(); });
  window.addEventListener('online', () => { nuvemPush(); nuvemPull(false); });
  window.addEventListener('pagehide', () => nuvemPush());
}

function juntarApp(a, b){
  const byId = (x, y) => { const m = new Map(); (x||[]).forEach(i => m.set(i.id, i)); (y||[]).forEach(i => { if (!m.has(i.id)) m.set(i.id, i); }); return [...m.values()]; };
  a.habitos = byId(a.habitos, b.habitos);
  a.logs ||= {}; Object.entries(b.logs || {}).forEach(([h, dias]) => { a.logs[h] ||= {}; Object.assign(a.logs[h], dias); });
  a.tarefas = byId(a.tarefas, b.tarefas);
  a.checkins ||= {}; Object.entries(b.checkins || {}).forEach(([d, c]) => { const x = a.checkins[d]; if (!x || (!x.diario && !Object.values(x.resp||{}).some(v => v != null))) a.checkins[d] = c; });
  if (b.treino) {
    a.treino ||= b.treino;
    const ta = a.treino, tb = b.treino;
    const ultA = (ta.sessoes||[]).reduce((m,s) => s.inicio > m ? s.inicio : m, ''), ultB = (tb.sessoes||[]).reduce((m,s) => s.inicio > m ? s.inicio : m, '');
    ta.sessoes = byId(ta.sessoes, tb.sessoes); ta.atividades = byId(ta.atividades, tb.atividades);
    const pd = new Map(); (tb.pesos||[]).forEach(p => pd.set(p.data, p)); (ta.pesos||[]).forEach(p => pd.set(p.data, p)); ta.pesos = [...pd.values()];
    Object.entries(tb.ex || {}).forEach(([id, x]) => { ta.ex[id] ||= x; });
    if (ultB > ultA) { ta.prox = tb.prox; ta.adiantados = tb.adiantados || []; ta.rotinas = tb.rotinas || ta.rotinas; }
  }
  a.alongamentos = byId(a.alongamentos, b.alongamentos);
  if (b.dieta) { a.dieta ||= b.dieta; a.dieta.dias ||= {}; Object.entries(b.dieta.dias || {}).forEach(([d, v]) => { const x = a.dieta.dias[d]; if (!x || (!Object.keys(x.ref||{}).length && x.prot == null && !x.livres)) a.dieta.dias[d] = v; }); }
  if (b.pomodoro) { a.pomodoro ||= b.pomodoro; a.pomodoro.tags = byId(a.pomodoro.tags, b.pomodoro.tags); a.pomodoro.sessoes = byId(a.pomodoro.sessoes, b.pomodoro.sessoes); if (!a.pomodoro.cfg.tag && b.pomodoro.cfg) a.pomodoro.cfg.tag = b.pomodoro.cfg.tag; }
  a.mig = Object.assign({}, b.mig || {}, a.mig || {});
  return a;
}
