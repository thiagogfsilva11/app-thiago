  $('#bkPaste').onclick = () => openModal(`<h3>Colar backup</h3><p class="muted" style="font-size:13px;margin-bottom:10px">Cole aqui o texto do backup (de "Copiar backup").</p><textarea id="bkIn2" rows="8" placeholder='{"app":"App Thiago",...}'></textarea><div class="foot"><button class="btn btn-ghost" data-x>Cancelar</button><button class="btn btn-dark" id="bkGo">Restaurar</button></div>`, b => {
    b.querySelector('[data-x]').onclick = closeModal;
    b.querySelector('#bkGo').onclick = () => { try { restaurarBackup(JSON.parse(b.querySelector('#bkIn2').value)); } catch(e){ toast('Texto inválido: cole o backup inteiro'); } };
  });
  if ($('#bkOut')) $('#bkOut').onclick = () => {
    const data = {app:'App Thiago', versao:1, criadoEm:new Date().toISOString(), chaves:{}};
    [KEY, ...Object.values(EMBED_KEYS)].forEach(k => { const v = lsGet(k); if (v != null) data.chaves[k] = v; });
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type:'application/json'}));
    a.download = 'backup-app-thiago-' + todayISO() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Backup baixado ✓');
  };
  $('#bkIn').onclick = () => $('#bkFile').click();
  $('#bkFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return; e.target.value = '';
    const rd = new FileReader(); rd.onload = () => {
      try { restaurarBackup(JSON.parse(rd.result)); } catch(err) { toast('Arquivo inválido: use um backup baixado aqui em Ajustes'); }
    }; rd.readAsText(f);
  };
  $('#rsApp').onclick = () => confirmBox('Apagar hábitos, tarefas, check-ins e treino deste navegador? Recomendo baixar um backup antes.', 'Apagar tudo', () => {
    const cfg = S.config, pc = S.pomodoro.cfg; S = seed(); S.habitos = []; S.logs = {}; S.tarefas = []; S.config = cfg;
    S.pomodoro = {cfg:Object.assign(pc, {tag:''}), tags:[], sessoes:[], run:null}; S.mig = {ci3:true, ciAntidoto:true, treinoV2:true}; S.alongamentos = []; S.dieta.dias = {}; save(); toast('App zerado'); render(); });
};

/* =========================================================
   INÍCIO DO APP
   ========================================================= */
/* =========================================================
   NUVEM (Supabase): login próprio + sincronização entre aparelhos
   Cada área do app (app, finanças, leitura bíblica, oração) é uma linha na tabela "estado".
   O aparelho continua guardando tudo localmente (funciona sem internet) e sincroniza quando dá.
   ========================================================= */
const SUPA = { url: 'https://rsdxjptswrvslzbwngue.supabase.co', key: 'sb_publishable_45AKUWGcIYIXwMxmwiXAhA_9ZCr4K9Y' };
const SM_KEY = 'appThiago_sync';
let sb = null, nuvemUser = null, appIniciado = false;
const nv = { status:'off', quando:null, erro:'' };
const SYNC_KEYS = () => [KEY, ...Object.values(EMBED_KEYS)];
function hashStr(s){ let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return s.length + ':' + h; }
function syncMeta(){ try { return JSON.parse(localStorage.getItem(SM_KEY)) || {}; } catch(e){ return {}; } }
function setSyncMeta(m){ try { localStorage.setItem(SM_KEY, JSON.stringify(m)); } catch(e){} }
function nvStatus(st, erro){
  nv.status = st; if (st === 'ok') nv.quando = new Date(); nv.erro = erro || '';
  const txt = st === 'ok' ? `Sincronizado ✓ ${nv.quando.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}` : st === 'salvando' ? 'Salvando na nuvem…' : st === 'offline' ? 'Sem internet · salvo no aparelho' : st === 'erro' ? 'Erro ao sincronizar · salvo no aparelho' : '';
  $$('.nv-status').forEach(el => { el.textContent = txt; el.dataset.st = st; });
}
// envia as áreas que mudaram desde a última sincronização
let pushing = false;
async function nuvemPush(){
  if (!sb || !nuvemUser || pushing) return;
  const m = syncMeta(); m.ultimo ||= {}; m.sujo ||= {};
  const mudou = SYNC_KEYS().filter(k => { const v = lsGet(k); return v != null && hashStr(v) !== m.ultimo[k]; });
  if (!mudou.length) return;
  if (!navigator.onLine) return nvStatus('offline');
  pushing = true; nvStatus('salvando');
  try {
    const rows = mudou.map(k => { const v = lsGet(k); m.sujo[k] ||= new Date().toISOString(); return {user_id:nuvemUser.id, chave:k, valor:v, atualizado:new Date().toISOString(), _h:hashStr(v)}; });
    const { error } = await sb.from('estado').upsert(rows.map(({_h, ...r}) => r), {onConflict:'user_id,chave'});
    if (error) throw error;
    rows.forEach(r => { m.ultimo[r.chave] = r._h; delete m.sujo[r.chave]; });
    m.puxado = new Date().toISOString(); setSyncMeta(m); nvStatus('ok');
  } catch(e){ nvStatus(navigator.onLine ? 'erro' : 'offline', e.message); }
  pushing = false;
}
// traz da nuvem o que outro aparelho mudou
async function nuvemPull(primeira){
  if (!sb || !nuvemUser) return false;
  if (!navigator.onLine) { nvStatus('offline'); return false; }
  try {
    const { data, error } = await sb.from('estado').select('chave,valor,atualizado');
    if (error) throw error;
    const m = syncMeta(); m.ultimo ||= {}; m.sujo ||= {};
    let mudouApp = false, mudouEmbed = false;
    (data || []).forEach(r => {
      if (!SYNC_KEYS().includes(r.chave)) return;
      const local = lsGet(r.chave);
      if (local === r.valor) { m.ultimo[r.chave] = hashStr(r.valor); return; }
      const localMexido = local != null && hashStr(local) !== m.ultimo[r.chave];
      // se este aparelho mudou algo ainda não enviado, vence o mais recente
      if (localMexido && !primeira && m.sujo[r.chave] && new Date(m.sujo[r.chave]) > new Date(r.atualizado)) return;
      try { localStorage.setItem(r.chave, r.valor); } catch(e){ return; }
      m.ultimo[r.chave] = hashStr(r.valor); delete m.sujo[r.chave];
      if (r.chave === KEY) mudouApp = true; else mudouEmbed = true;
    });
    setSyncMeta(m); nvStatus('ok');
    if (appIniciado && (mudouApp || mudouEmbed)) {
      if (mudouApp) { load(); applyTheme(); }
      Object.keys(embedCache || {}).forEach(k => delete embedCache[k]);
      const editando = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if (!editando && $('#modal').classList.contains('hidden')) render();
    }
    return mudouApp || mudouEmbed;
  } catch(e){ nvStatus(navigator.onLine ? 'erro' : 'offline', e.message); return false; }
}
function nuvemLoop(){
  // detecta mudanças (inclusive as feitas dentro de Finanças e Bíblia) e envia
  setInterval(() => {
    const m = syncMeta(); m.ultimo ||= {}; m.sujo ||= {}; let marcou = false;
    SYNC_KEYS().forEach(k => { const v = lsGet(k); if (v != null && hashStr(v) !== m.ultimo[k] && !m.sujo[k]) { m.sujo[k] = new Date().toISOString(); marcou = true; } });
    if (marcou) setSyncMeta(m);
    nuvemPush();
  }, 3000);
  setInterval(() => { if (!document.hidden) nuvemPull(false); }, 45000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) nuvemPull(false); else nuvemPush(); });
  window.addEventListener('online', () => { nuvemPush(); nuvemPull(false); });
  window.addEventListener('pagehide', () => nuvemPush());
}
function authTela(msg){
  const el = document.createElement('div'); el.id = 'auth';
  el.innerHTML = `<form class="auth-box" id="authForm" novalidate>
    <div class="brand" style="justify-content:center;margin-bottom:6px"><span class="brand-mark">T</span><span>App Thiago</span></div>
    <p class="muted" id="authSub" style="text-align:center;font-size:13px;margin-bottom:18px">Entre para ver seus dados em qualquer aparelho.</p>
    <div class="field"><label for="auEmail">E-mail</label><input id="auEmail" type="email" autocomplete="email" inputmode="email" required></div>
    <div class="field"><label for="auPass">Senha</label><input id="auPass" type="password" autocomplete="current-password" minlength="6" required></div>
    <button class="btn btn-dark btn-block" id="auGo" type="submit" style="padding:13px">Entrar</button>
    <p class="auth-msg" id="auMsg">${msg ? esc(msg) : ''}</p>
    <button class="btn btn-ghost btn-block" id="auToggle" type="button" style="margin-top:6px">Ainda não tenho conta · Criar conta</button>
  </form>`;
  document.body.appendChild(el);
  let criar = false;
  const f = $('#authForm'), msgEl = $('#auMsg');
  $('#auToggle').onclick = () => { criar = !criar; $('#auGo').textContent = criar ? 'Criar conta' : 'Entrar'; $('#auToggle').textContent = criar ? 'Já tenho conta · Entrar' : 'Ainda não tenho conta · Criar conta'; $('#auPass').autocomplete = criar ? 'new-password' : 'current-password'; $('#authSub').textContent = criar ? 'Crie seu login. Use uma senha que só você saiba.' : 'Entre para ver seus dados em qualquer aparelho.'; msgEl.textContent = ''; };
  f.onsubmit = async e => {
    e.preventDefault();
    const email = $('#auEmail').value.trim(), password = $('#auPass').value;
    if (!email || password.length < 6) { msgEl.textContent = 'Informe o e-mail e uma senha de pelo menos 6 caracteres.'; return; }
    $('#auGo').disabled = true; msgEl.textContent = criar ? 'Criando sua conta…' : 'Entrando…';
    try {
      const r = criar ? await sb.auth.signUp({email, password, options:{emailRedirectTo: location.origin + location.pathname}}) : await sb.auth.signInWithPassword({email, password});
      if (r.error) throw r.error;
      if (criar && !r.data.session) { msgEl.innerHTML = 'Conta criada. <b>Abra o e-mail de confirmação</b> que acabamos de enviar, toque no link e depois entre aqui.'; criar = false; $('#auToggle').click(); $('#auToggle').click(); $('#auGo').disabled = false; return; }
      el.remove(); await entrar(r.data.session.user);
    } catch(err){
      const t = String(err.message || err);
      msgEl.textContent = /Invalid login/i.test(t) ? 'E-mail ou senha incorretos.' : /not confirmed/i.test(t) ? 'Confirme seu e-mail primeiro (veja sua caixa de entrada).' : /already registered/i.test(t) ? 'Esse e-mail já tem conta. Toque em "Já tenho conta".' : /fetch|network/i.test(t) ? 'Sem conexão. Tente de novo quando tiver internet.' : 'Não deu certo: ' + t;
      $('#auGo').disabled = false;
    }
  };
}
async function entrar(user){
  nuvemUser = user;
  const m = syncMeta();
  if (m.user !== user.id) {
    // aparelho novo (ou outra conta): começa limpo e traz tudo da nuvem antes de abrir
    SYNC_KEYS().forEach(k => { try { localStorage.removeItem(k); } catch(e){} });
    setSyncMeta({user:user.id, ultimo:{}, sujo:{}});
    nvStatus('salvando');
    await Promise.race([nuvemPull(true), new Promise(r => setTimeout(r, 9000))]);
  }
  if (!appIniciado) { appIniciado = true; iniciarApp(); nuvemLoop(); }
  nuvemPull(false);
}
async function nuvemIniciar(){
  try { sb = window.supabase.createClient(SUPA.url, SUPA.key, {auth:{persistSession:true, autoRefreshToken:true}}); }
  catch(e){ document.body.innerHTML = '<p style="padding:30px;font-family:sans-serif">Não consegui carregar o app. Verifique a internet e abra de novo.</p>'; return; }
  const { data } = await sb.auth.getSession();
  if (data && data.session) await entrar(data.session.user); else authTela();
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') location.reload(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
async function nuvemSair(){
  await nuvemPush();
  SYNC_KEYS().forEach(k => { try { localStorage.removeItem(k); } catch(e){} });
  setSyncMeta({});
  await sb.auth.signOut();
  location.reload();
}

/* ---------- juntar dois backups do app (sem apagar nada) ---------- */
function juntarApp(a, b){
  const byId = (x, y) => { const m = new Map(); (x||[]).forEach(i => m.set(i.id, i)); (y||[]).forEach(i => { if (!m.has(i.id)) m.set(i.id, i); }); return [...m.values()]; };
  a.habitos = byId(a.habitos, b.habitos);
  a.logs ||= {}; Object.entries(b.logs || {}).forEach(([h, dias]) => { a.logs[h] ||= {}; Object.assign(a.logs[h], dias); });
  a.tarefas = byId(a.tarefas, b.tarefas);
  a.checkins ||= {}; Object.entries(b.checkins || {}).forEach(([d, c]) => { const x = a.checkins[d]; if (!x || (!x.diario && !Object.values(x.resp||{}).some(v => v != null))) a.checkins[d] = c; });
  if (b.treino) {
    a.treino ||= b.treino;
    const ta = a.treino, tb = b.treino;
    const ultA = (ta.sessoes||[]).reduce((m,s) => s.inicio > m ? s.inicio : m, ''), ultB = (tb.sessoes||[]).reduce((m,s) => s.inicio > m ? s.inicio : m, '');
    ta.sessoes = byId(ta.sessoes, tb.sessoes); ta.atividades = byId(ta.atividades, tb.atividades);
    const pd = new Map(); (tb.pesos||[]).forEach(p => pd.set(p.data, p)); (ta.pesos||[]).forEach(p => pd.set(p.data, p)); ta.pesos = [...pd.values()];
    Object.entries(tb.ex || {}).forEach(([id, x]) => { ta.ex[id] ||= x; });
    if (ultB > ultA) { ta.prox = tb.prox; ta.adiantados = tb.adiantados || []; ta.rotinas = tb.rotinas || ta.rotinas; }
  }
  a.alongamentos = byId(a.alongamentos, b.alongamentos);
  if (b.dieta) { a.dieta ||= b.dieta; a.dieta.dias ||= {}; Object.entries(b.dieta.dias || {}).forEach(([d, v]) => { const x = a.dieta.dias[d]; if (!x || (!Object.keys(x.ref||{}).length && x.prot == null && !x.livres)) a.dieta.dias[d] = v; }); }
  if (b.doente) { a.doente ||= {}; Object.entries(b.doente).forEach(([d, v]) => { if (!a.doente[d]) a.doente[d] = v; }); }
  if (b.dieta && b.dieta.fora && a.dieta) { a.dieta.fora ||= {}; Object.entries(b.dieta.fora).forEach(([d, v]) => { if (!a.dieta.fora[d]) a.dieta.fora[d] = v; }); }
  if (b.pomodoro) { a.pomodoro ||= b.pomodoro; a.pomodoro.tags = byId(a.pomodoro.tags, b.pomodoro.tags); a.pomodoro.sessoes = byId(a.pomodoro.sessoes, b.pomodoro.sessoes); if (!a.pomodoro.cfg.tag && b.pomodoro.cfg) a.pomodoro.cfg.tag = b.pomodoro.cfg.tag; }
  a.mig = Object.assign({}, b.mig || {}, a.mig || {});
  return a;
}

function iniciarApp(){
load();
buildNav();
applyTheme();
if (NUVEM) { const sn = $('.side-note'); if (sn) sn.innerHTML = '<span class="nv-status"></span>'; }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
$('#themeBtn').onclick = toggleTheme; $('#themeBtnM').onclick = toggleTheme;
$('#menuBtn').onclick = () => $('#app').classList.toggle('menu-open');
$('#scrim').onclick = () => $('#app').classList.remove('menu-open');
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeMenu(); }
  // barra de espaço inicia/pausa o pomodoro (ou o alongamento)
  if (e.code === 'Space' && route === 'alongamento' && AL && !e.target.closest('input,textarea,select,button') && $('#modal').classList.contains('hidden')) { e.preventDefault(); $('#alPlay') && $('#alPlay').click(); }
  // (fora de campos de texto e de janelas abertas)
  if (e.code === 'Space' && route === 'pomodoro' && !e.target.closest('input,textarea,select,button') && $('#modal').classList.contains('hidden')) {
    e.preventDefault(); const r = P().run; (r && r.rodando) ? pomoPause() : pomoStart();
  }
});
setInterval(() => { pomoTick(false); treinoTick(); alongTick(); }, 250);
// ao voltar para a aba do navegador, atualiza na hora
document.addEventListener('visibilitychange', () => { if (!document.hidden) pomoTick(route === 'pomodoro'); });
document.querySelector('.side-foot [data-route]').onclick = () => navTo('ajustes');
window.addEventListener('hashchange', go);
// volta para o dia certo se o app ficar aberto de um dia para o outro
var lastDay = todayISO();
setInterval(() => { if (todayISO() !== lastDay) { lastDay = todayISO(); ciDate = null; if (route === 'inicio' || route === 'habitos') render(); } }, 60000);
go();
}
if (NUVEM) nuvemIniciar(); else iniciarApp();
